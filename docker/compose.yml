name: aonik

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_strong_Password123!}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-Your_strong_Password123!}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sql,1433;Database=AonikDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Password123!};TrustServerCertificate=True;
    ports:
      - "8080:8080"
    depends_on:
      sql:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sql,1433;Database=AonikDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Password123!};TrustServerCertificate=True;
    depends_on:
      sql:
        condition: service_healthy

volumes:
  sql-data:
