openapi: 3.1.0
info:
  title: AONIK API
  version: 1.0.0
  description: >
    The AONIK API lets you build on top of a modular financial platform that
    powers bill payments, remittances, and billing.


    ## Base URL


    ```

    https://api.aonik.io

    ```


    ## Authentication


    All API requests require a Bearer token in the `Authorization` header.


    ```

    Authorization: Bearer YOUR_ACCESS_TOKEN

    ```


    You can obtain an access token by calling the [Get Token](/api/get-token) endpoint with your credentials, or through the OAuth 2.0 authorization code flow via your configured auth provider (Auth0 or Azure AD).


    ## Pagination


    List endpoints return paginated results. Use `page` and `pageSize` query parameters to navigate through results. Responses include pagination metadata.


    ## Errors


    The API uses standard HTTP status codes. Error responses include a `message` field with a human-readable description.


    | Status | Description |

    |--------|-------------|

    | 400 | Bad request — check your parameters |

    | 401 | Unauthorized — invalid or missing token |

    | 403 | Forbidden — insufficient permissions |

    | 404 | Not found |

    | 409 | Conflict — resource already exists |

    | 422 | Validation error |

    | 500 | Server error |
servers:
  - url: https://api.aonik.io
    description: Production API
security:
  - bearerAuth: []
tags:
  - name: Orders
    description: Create and manage bill payment orders. An order captures a
      requested financial service.
  - name: Payments
    description: Create payment intents to fund orders.
  - name: Billing
    description: Create and manage invoices.
  - name: Ledger
    description: Double-entry accounting ledger. The source of financial truth.
  - name: Catalog
    description: Browse billers, services, countries, and currencies.
  - name: Pricing
    description: Get pricing quotes and manage FX rates.
  - name: Partners
    description: Manage financial service partners and their configurations.
  - name: Identity
    description: Authentication, user profiles, and verification.
  - name: Registration
    description: User registration and onboarding.
  - name: Tenants
    description: Tenant management (admin).
  - name: Users
    description: User management (admin).
  - name: Roles
    description: Role and permission management (admin).
  - name: Compliance
    description: Document verification and compliance management.
  - name: AI
    description: Chat with AI agents, manage threads, and configure agents.
  - name: CMS
    description: Content management for in-app content blocks.
paths:
  /orders:
    get:
      operationId: listOrders
      tags:
        - Orders
      summary: List orders
      description: Retrieve a paginated list of orders.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - submitted
              - processing
              - completed
              - cancelled
        - name: orderType
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A paginated list of orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderListItem"
  /orders/bill-payments:
    post:
      operationId: createBillPaymentOrder
      tags:
        - Orders
      summary: Create a bill payment order
      description: Create a new order for paying one or more bills.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillPaymentOrderRequest"
      responses:
        "201":
          description: The created order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillPaymentOrderResponse"
  "/orders/{orderId}":
    get:
      operationId: getOrder
      tags:
        - Orders
      summary: Retrieve an order
      description: Get a single order with all its items.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillPaymentOrderResponse"
        "404":
          description: Order not found.
  "/orders/{orderId}/submit":
    post:
      operationId: submitOrder
      tags:
        - Orders
      summary: Submit an order
      description: Submit a draft order for processing. The order must be fully funded
        before submission.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order submitted.
  "/orders/{orderId}/cancel":
    post:
      operationId: cancelOrder
      tags:
        - Orders
      summary: Cancel an order
      description: Cancel a draft or submitted order.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order cancelled.
  "/orders/{orderId}/items/bill-payments":
    post:
      operationId: addOrderItem
      tags:
        - Orders
      summary: Add an item to an order
      description: Add a bill payment item to an existing draft order.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillPaymentItemRequest"
      responses:
        "201":
          description: Item added.
  "/orders/{orderId}/items/{orderItemId}":
    put:
      operationId: updateOrderItem
      tags:
        - Orders
      summary: Update an order item
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: orderItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillPaymentItemRequest"
      responses:
        "200":
          description: Item updated.
    delete:
      operationId: removeOrderItem
      tags:
        - Orders
      summary: Remove an order item
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: orderItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Item removed.
  /payments/intents:
    post:
      operationId: createPaymentIntent
      tags:
        - Payments
      summary: Create a payment intent
      description: Create a payment intent to fund an order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntentRequest"
      responses:
        "201":
          description: The created payment intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
  "/payments/intents/{id}":
    get:
      operationId: getPaymentIntent
      tags:
        - Payments
      summary: Retrieve a payment intent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The payment intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
  "/payments/intents/{id}/capture":
    post:
      operationId: capturePayment
      tags:
        - Payments
      summary: Capture a payment
      description: Capture a previously authorized payment intent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment captured.
  "/payments/intents/{id}/cancel":
    post:
      operationId: cancelPayment
      tags:
        - Payments
      summary: Cancel a payment
      description: Cancel a payment intent that has not been captured.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment cancelled.
  /billing/invoices:
    post:
      operationId: createInvoice
      tags:
        - Billing
      summary: Create an invoice
      description: Create a new invoice for a customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: The created invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
  "/billing/invoices/{id}":
    get:
      operationId: getInvoice
      tags:
        - Billing
      summary: Retrieve an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
  /ledger:
    get:
      operationId: listLedgers
      tags:
        - Ledger
      summary: List ledgers
      description: Retrieve all ledgers for the current tenant.
      responses:
        "200":
          description: A list of ledgers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerResponse"
    post:
      operationId: createLedger
      tags:
        - Ledger
      summary: Create a ledger
      description: Create a new double-entry ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseCurrency:
                  type: string
                  description: The base currency for the ledger (e.g. USD, NGN).
              required:
                - baseCurrency
      responses:
        "201":
          description: The created ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerResponse"
  /ledger/accounts:
    get:
      operationId: listLedgerAccounts
      tags:
        - Ledger
      summary: List ledger accounts
      description: Retrieve all accounts across ledgers.
      responses:
        "200":
          description: A list of ledger accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerAccountResponse"
    post:
      operationId: createLedgerAccount
      tags:
        - Ledger
      summary: Create a ledger account
      description: Create a new account in a ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLedgerAccountRequest"
      responses:
        "201":
          description: The created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerAccountResponse"
  /ledger/journal-entries:
    get:
      operationId: listJournalEntries
      tags:
        - Ledger
      summary: List journal entries
      description: Retrieve journal entries. Every financial transaction is recorded
        as a balanced journal entry.
      responses:
        "200":
          description: A list of journal entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntryResponse"
    post:
      operationId: addJournalEntry
      tags:
        - Ledger
      summary: Add a journal entry
      description: Record a new journal entry. Debits must equal credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddJournalEntryRequest"
      responses:
        "201":
          description: The created journal entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryResponse"
  /catalog/countries:
    get:
      operationId: listCountries
      tags:
        - Catalog
      summary: List countries
      description: Get all supported countries.
      responses:
        "200":
          description: A list of countries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        countryCode:
                          type: string
                        name:
                          type: string
  /catalog/currencies:
    get:
      operationId: listCurrencies
      tags:
        - Catalog
      summary: List currencies
      description: Get all supported currencies.
      responses:
        "200":
          description: A list of currencies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  currencies:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        name:
                          type: string
                  defaultCurrencyCode:
                    type: string
  /catalog/billers/categories:
    get:
      operationId: listBillerCategories
      tags:
        - Catalog
      summary: List biller categories
      description: Get all biller categories (e.g. utilities, telecoms, insurance).
      parameters:
        - name: countryCode
          in: query
          schema:
            type: string
          description: Filter by country.
      responses:
        "200":
          description: A list of categories.
  /catalog/billers:
    get:
      operationId: listBillers
      tags:
        - Catalog
      summary: List billers
      description: Get a paginated list of billers.
      parameters:
        - name: countryCode
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: A paginated list of billers.
  "/catalog/billers/{billerId}":
    get:
      operationId: getBiller
      tags:
        - Catalog
      summary: Retrieve a biller
      description: Get details of a biller including service count and support info.
      parameters:
        - name: billerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Biller details.
  "/catalog/billers/{billerId}/services":
    get:
      operationId: listBillerServices
      tags:
        - Catalog
      summary: List biller services
      description: Get the services offered by a biller.
      parameters:
        - name: billerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of services.
  "/catalog/billers/{billerId}/services/{serviceId}":
    get:
      operationId: getBillerService
      tags:
        - Catalog
      summary: Retrieve a biller service
      description: Get full details of a biller service including required fields and
        validation.
      parameters:
        - name: billerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Service details with required fields.
  "/catalog/billers/{billerId}/services/{serviceId}/validate":
    post:
      operationId: validateServiceFields
      tags:
        - Catalog
      summary: Validate service fields
      description: Validate customer-provided fields for a service before placing an order.
      parameters:
        - name: billerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: Validation result.
  /pricing/quote:
    post:
      operationId: getPricingQuote
      tags:
        - Pricing
      summary: Get a pricing quote
      description: Get a pricing quote including exchange rate, fees, and total cost
        for a transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingQuoteRequest"
      responses:
        "200":
          description: The pricing quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingQuoteResponse"
  /fx-quotes:
    get:
      operationId: listFxQuotes
      tags:
        - Pricing
      summary: List FX quotes
      description: List foreign exchange rate quotes.
      responses:
        "200":
          description: A list of FX quotes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FxQuoteResponse"
    post:
      operationId: createFxQuote
      tags:
        - Pricing
      summary: Create an FX quote
      description: Create a new FX rate quote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFxQuoteRequest"
      responses:
        "201":
          description: The created FX quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxQuoteResponse"
  "/fx-quotes/{id}":
    get:
      operationId: getFxQuote
      tags:
        - Pricing
      summary: Retrieve an FX quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The FX quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxQuoteResponse"
    put:
      operationId: updateFxQuote
      tags:
        - Pricing
      summary: Update an FX quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFxQuoteRequest"
      responses:
        "200":
          description: FX quote updated.
    delete:
      operationId: deleteFxQuote
      tags:
        - Pricing
      summary: Delete an FX quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: FX quote deleted.
  /admin/partners:
    get:
      operationId: listPartners
      tags:
        - Partners
      summary: List partners
      description: Get a paginated list of financial service partners.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: countryCode
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A list of partners.
    post:
      operationId: createPartner
      tags:
        - Partners
      summary: Create a partner
      description: Register a new financial service partner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                capabilitiesJson:
                  type: string
                operatingHoursJson:
                  type: string
              required:
                - name
      responses:
        "201":
          description: The created partner.
  "/admin/partners/{partnerId}":
    get:
      operationId: getPartner
      tags:
        - Partners
      summary: Retrieve a partner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Partner details.
    patch:
      operationId: updatePartner
      tags:
        - Partners
      summary: Update a partner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                capabilitiesJson:
                  type: string
                operatingHoursJson:
                  type: string
      responses:
        "200":
          description: Partner updated.
    delete:
      operationId: deletePartner
      tags:
        - Partners
      summary: Delete a partner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Partner deleted.
  /auth/token:
    post:
      operationId: getToken
      tags:
        - Identity
      summary: Get token
      description: Authenticate and receive an access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: The access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /v1/me:
    get:
      operationId: getCurrentUser
      tags:
        - Identity
      summary: Get current user
      description: Get the authenticated user's basic info.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
  /identity/userinfo:
    get:
      operationId: getUserInfo
      tags:
        - Identity
      summary: Get user info
      description: Get detailed user information including roles.
      responses:
        "200":
          description: User info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
  /profiles/customers/me:
    get:
      operationId: getMyProfile
      tags:
        - Identity
      summary: Get my profile
      description: Get the authenticated user's customer profile.
      responses:
        "200":
          description: Customer profile.
    put:
      operationId: updateMyProfile
      tags:
        - Identity
      summary: Update my profile
      description: Update the authenticated user's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
      responses:
        "200":
          description: Profile updated.
  /identity/password/forgot:
    post:
      operationId: forgotPassword
      tags:
        - Identity
      summary: Request password reset
      description: Send a password reset email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                tenantId:
                  type: string
                  format: uuid
              required:
                - email
                - tenantId
      responses:
        "200":
          description: Reset email sent.
  /v1/verifications/email/start:
    post:
      operationId: startEmailVerification
      tags:
        - Identity
      summary: Start email verification
      description: Send a verification code to an email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: Verification code sent.
  /v1/verifications/email/confirm:
    post:
      operationId: confirmEmailVerification
      tags:
        - Identity
      summary: Confirm email verification
      description: Confirm an email address with the verification code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
              required:
                - email
                - code
      responses:
        "200":
          description: Email verified.
  /v1/registrations/individual:
    post:
      operationId: registerIndividual
      tags:
        - Registration
      summary: Register an individual
      description: Register a new individual user account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterIndividualRequest"
      responses:
        "201":
          description: Registration successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
  /v1/onboarding/me:
    get:
      operationId: getOnboardingStatus
      tags:
        - Registration
      summary: Get onboarding status
      description: Get the current user's onboarding progress and next steps.
      responses:
        "200":
          description: Onboarding status.
  /admin/tenants:
    get:
      operationId: listTenants
      tags:
        - Tenants
      summary: List tenants
