components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pass your access token in the Authorization header.
  schemas:
    CreateBillPaymentOrderRequest:
      type: object
      properties:
        payerPartyId:
          type: string
          format: uuid
          description: The party placing the order.
        originCountry:
          type: string
          example: US
        originCurrency:
          type: string
          example: USD
        purposeCode:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        idempotencyKey:
          type: string
          nullable: true
          description: A unique key to prevent duplicate orders.
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateBillPaymentItemRequest"
      required:
        - payerPartyId
        - originCountry
        - originCurrency
    CreateBillPaymentItemRequest:
      type: object
      properties:
        billerId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        serviceCode:
          type: string
        serviceFieldValues:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs of service-specific fields.
        destinationAmount:
          type: number
          format: decimal
        destinationCurrency:
          type: string
        destinationCountry:
          type: string
        pricingQuoteId:
          type: string
          format: uuid
      required:
        - billerId
        - serviceId
        - serviceCode
        - serviceFieldValues
        - destinationCurrency
        - destinationCountry
        - pricingQuoteId
    UpdateBillPaymentItemRequest:
      type: object
      properties:
        serviceFieldValues:
          type: object
          additionalProperties:
            type: string
        originAmount:
          type: number
          format: decimal
        destinationAmount:
          type: number
          format: decimal
        pricingQuoteId:
          type: string
          format: uuid
        purposeCode:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    BillPaymentOrderResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        orderType:
          type: string
          example: bill_payment
        status:
          type: string
          example: draft
        payerPartyId:
          type: string
          format: uuid
        payerName:
          type: string
        originCountry:
          type: string
        originCurrency:
          type: string
        totalAmountIn:
          type: number
          format: decimal
        totalFeesAmount:
          type: number
          format: decimal
        totalAmountOut:
          type: number
          format: decimal
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemResponse"
    OrderItemResponse:
      type: object
      properties:
        orderItemId:
          type: string
          format: uuid
        billerName:
          type: string
        serviceName:
          type: string
        receiverName:
          type: string
        amountIn:
          type: number
          format: decimal
        currencyIn:
          type: string
        amountOut:
          type: number
          format: decimal
        currencyOut:
          type: string
        feesTotal:
          type: number
          format: decimal
        exchangeRate:
          type: number
          format: decimal
        status:
          type: string
    OrderListItem:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        orderType:
          type: string
        status:
          type: string
        payerName:
          type: string
        originCurrency:
          type: string
        totalAmountIn:
          type: number
          format: decimal
        createdAt:
          type: string
          format: date-time
    CreatePaymentIntentRequest:
      type: object
      properties:
        amount:
          type: number
          format: decimal
          description: The payment amount.
          example: 100
        currency:
          type: string
          example: USD
        reference:
          type: string
          description: A reference for the payment.
        orderId:
          type: string
          format: uuid
          description: The order being paid for.
        invoiceId:
          type: string
          format: uuid
          nullable: true
      required:
        - amount
        - currency
        - reference
        - orderId
    PaymentIntentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
          format: decimal
        currency:
          type: string
        status:
          type: string
          example: pending
        reference:
          type: string
        createdUtc:
          type: string
          format: date-time
    CreateInvoiceRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
          example: INV-001
        currency:
          type: string
          example: USD
        dueUtc:
          type: string
          format: date-time
        lineItems:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
                example: Consulting services
              quantity:
                type: number
                format: decimal
                example: 10
              unitPrice:
                type: number
                format: decimal
                example: 150
            required:
              - description
              - quantity
              - unitPrice
      required:
        - customerId
        - invoiceNumber
        - currency
        - dueUtc
        - lineItems
    InvoiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        currency:
          type: string
        totalAmount:
          type: number
          format: decimal
        status:
          type: string
          example: draft
        issuedUtc:
          type: string
          format: date-time
        dueUtc:
          type: string
          format: date-time
        lineItems:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              description:
                type: string
              quantity:
                type: number
                format: decimal
              unitPrice:
                type: number
                format: decimal
              lineTotal:
                type: number
                format: decimal
    LedgerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        baseCurrency:
          type: string
        createdUtc:
          type: string
          format: date-time
    CreateLedgerAccountRequest:
      type: object
      properties:
        ledgerId:
          type: string
          format: uuid
        name:
          type: string
          example: Cash
        code:
          type: string
          example: "1000"
        accountType:
          type: string
          enum:
            - asset
            - liability
            - equity
            - revenue
            - expense
          example: asset
      required:
        - ledgerId
        - name
        - code
        - accountType
    LedgerAccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ledgerId:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        accountType:
          type: string
        currency:
          type: string
        createdUtc:
          type: string
          format: date-time
    AddJournalEntryRequest:
      type: object
      properties:
        ledgerId:
          type: string
          format: uuid
        reference:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        lines:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
                format: uuid
              direction:
                type: string
                enum:
                  - debit
                  - credit
              amount:
                type: number
                format: decimal
              currency:
                type: string
              narration:
                type: string
                nullable: true
            required:
              - accountId
              - direction
              - amount
              - currency
      required:
        - ledgerId
        - lines
    JournalEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ledgerId:
          type: string
          format: uuid
        entryUtc:
          type: string
          format: date-time
        status:
          type: string
        reference:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        lines:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              accountId:
                type: string
                format: uuid
              direction:
                type: string
              amount:
                type: number
                format: decimal
              currency:
                type: string
              narration:
                type: string
                nullable: true
    PricingQuoteRequest:
      type: object
      properties:
        originCurrency:
          type: string
          example: USD
        destinationCurrency:
          type: string
          example: NGN
        originCountry:
          type: string
          example: US
        destinationCountry:
          type: string
          example: NG
        serviceCode:
          type: string
        destinationAmount:
          type: number
          format: decimal
          nullable: true
          description: Specify either destinationAmount or originAmount.
        originAmount:
          type: number
          format: decimal
          nullable: true
      required:
        - originCurrency
        - destinationCurrency
        - originCountry
        - destinationCountry
        - serviceCode
    PricingQuoteResponse:
      type: object
      properties:
        pricingQuoteId:
          type: string
          format: uuid
        exchangeRate:
          type: number
          format: decimal
        feesTotal:
          type: number
          format: decimal
        totalAmount:
          type: number
          format: decimal
        originAmount:
