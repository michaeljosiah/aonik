<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container">
			<div class="py-4 mb-2">
				<a class=" back-page d-flex justify-content-center" href="profile-login-edit.html">
				Email address
				</a>
			</div>
			<form class="form form-complete" action="#" method="post">
				<div class="form_group">
					<input type="email" class="form_field" placeholder="Email" name="Email" id="email" value="johndoe@mail.com" required>
				    <label for="email" class="form_label">Current email address</label>
				</div>
				<div class="form_group">
					<input type="email" class="form_field" placeholder="Email" name="NewEmail" id="newemail" required>
				    <label for="newemail" class="form_label">Type your new email address</label>
				</div>
				<div class="form_group">
					<input type="password" class="form_field icon_field" placeholder="Password" name="Password" id="password" required>
					<span toggle="#password" class="toggle-password icon-eye"></span>
						
				    <label for="password" class="form_label">Type your password</label>
				</div>
				<button type="submit" class="btn btn-primary disabled my-3 w-100">SAVE CHANGES</button>
			</form>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
