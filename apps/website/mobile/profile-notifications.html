<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container">
			<div class="py-4 mb-2">
				<a class=" back-page d-flex justify-content-center" href="#">
				Notifications
				</a>
			</div>
		</div>
		<div class="container">
			<p>Choose what activities you want to be notified. Keep in mind, all notifications still will appear on your app inbox.</p>
			<nav>
				<div class="nav-tabs nav nav-fill">
					<a class="nav-link active" data-bs-toggle="tab" href="#tab-1">PUSH</a>
					<a class="nav-link" data-bs-toggle="tab" href="#tab-2">EMAIL</a>
				</div>
			</nav>
			<div class="tab-content">
				<div class="tab-pane fade show active" id="tab-1">
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="NewBills">New bills</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="NewBills" checked>
								</div>
							</div>
						</div>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="BillsUpdates">Bills updates</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="BillsUpdates" checked>
								</div>
							</div>
						</div>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="BillPay">Bill pay assist requests</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="BillPay">
								</div>
							</div>
						</div>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="MBAmessages">Bill MBA messages</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="MBAmessages" checked>
								</div>
							</div>
						</div>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="OrganisationsMessages">Organisations messages</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="OrganisationsMessages" checked>
								</div>
							</div>
						</div>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="FriendsMessages">Organisations messages</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="FriendsMessages">
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="tab-pane fade" id="tab-2">
					<div class="card-item py-3">
						<a class="row align-items-center" href="profile-login-email.html">
							<div class="col">
								<div class="d-flex align-items-center">
									<div class="card-content">
										<h4 class="card-title">Email for notifications</h4>
										<p class="title-sm fw-normal">johndoe@mail.com</p>
									</div>
								</div>
							</div>
							<div class="col-auto text-end">
								<img class="pe-2" src="images/icon-arrow.svg" alt="">
							</div>
						</a>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="NewBills1">New bills</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="NewBills1" checked>
								</div>
							</div>
						</div>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="BillsUpdates1">Bills updates</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="BillsUpdates1" checked>
								</div>
							</div>
						</div>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="BillPay1">Bill pay assist requests</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="BillPay1">
								</div>
							</div>
						</div>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="MBAmessages1">Bill MBA messages</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="MBAmessages1" checked>
								</div>
							</div>
						</div>
					</div>
					<div class="card-item py-3">
						<div class="form-check form-switch p-0 m-0">
							<div class="row align-items-center">
								<div class="col">
									<label class="card-title mb-0 form-check-label" for="OrganisationsMessages1">Organisations messages</label>
								</div>
								<div class="col-auto text-end">
									<input class="form-check-input" type="checkbox" role="switch" id="OrganisationsMessages1" checked>
								</div>
							</div>
						</div>
					</div>
				
				</div>
			</div>
		</div>
	</div>
	
	<div class="list-contact-modal modal fade px-0" id="listcontact" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="listcontactlabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered align-items-end">
			<div class="modal-content">
				<div class="modal-body">
					<div class="list-group">
						<a href="#" class="list-group-item">TAKE PHOTO</a>
						<a href="#" class="list-group-item">CHOOSE PHOTO</a>
						<a href="#" class="list-group-item active">DELETE PHOTO</a>
					</div>
					<button class="btn btn-primary w-100" type="button" data-bs-dismiss="modal" aria-label="Close">CANCEL</button>
				</div>
			</div>
		</div>	
	</div>	
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
