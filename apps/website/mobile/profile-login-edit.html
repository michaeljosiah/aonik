<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container">
			<div class="py-4">
				<a class=" back-page d-flex justify-content-center" href="#">
				Login details
				</a>
			</div>
		</div>
		<div class="container">
			<a class="row card-item py-3 align-items-center" href="profile-login-email.html">
				<div class="col">
					<div class="d-flex align-items-center">
						<div class="card-content">
							<h4 class="card-title">Email</h4>
							<p class="title-sm fw-normal">johndoe@mail.com</p>
						</div>
					</div>
				</div>
				<div class="col-auto text-end">
					<img class="pe-2" src="images/icon-arrow.svg" alt="">
				</div>
			</a>
			<a class="row card-item py-3 align-items-center" href="profile-login-password.html">
				<div class="col">
					<div class="d-flex align-items-center">
						<div class="card-content">
							<h4 class="card-title">Password</h4>
							<p class="title-sm fw-normal">●●●●●●●●</p>
						</div>
					</div>
				</div>
				<div class="col-auto text-end">
					<img class="pe-2" src="images/icon-arrow.svg" alt="">
				</div>
			</a>
			<div class=" form-check form-switch p-0 m-0">
				<div class="row card-item py-3 align-items-center">
					<div class="col">
						<label class="card-title form-check-label check-label-my" for="TouchId">Touch ID</label>
					</div>
					<div class="col-auto text-end">
						<input class="form-check-input" type="checkbox" role="switch" id="TouchId" checked>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
