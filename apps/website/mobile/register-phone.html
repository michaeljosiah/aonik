<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container">
			<div class="py-4 mb-4 d-flex justify-content-start">
				<a href="register.html">
					<svg width="13" height="20" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M9.89968 19.7993L12.021 17.678L2.12151 7.77848L0.000185311 9.8998L9.89968 19.7993Z" fill="#F37920"/>
						<path d="M12.0203 2.12132L9.899 0L-0.000494123 9.89949L2.12083 12.0208L12.0203 2.12132Z" fill="#F37920"/>
					</svg>
				</a>
			</div>
			<h2 class="mb-4 pb-2">Contact details</h2>
			<form class="form" action="phone-code.html" method="post">
				<div class="form_group">
					<label for="tel" class="title-label">Mobile number</label>
					<div class="row align-items-center mb-5">
						<div class="col-auto">
							<a class="flag-list flag-list-left d-flex align-items-center" href="country-phone-selection.html">
								<img src="images/flags/gb.svg" alt="UK">
								<strong>+44</strong>
							</a>
						</div>
						<div class="col">
							<input type="tel" class="form_input" placeholder="123 456 789" name="tel" id='tel'>
						</div>
					</div>
					<p>We'll send you a text message with a verification code. Message and data rates may apply.</p>
				</div>
				<button type="submit" class="btn btn-primary my-3 w-100">VERIFY NUMBER</button>
			</form>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
