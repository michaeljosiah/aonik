<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container">
			<div class="py-4">
				<a class=" back-page d-flex justify-content-center" href="#">
				Username
				</a>
			</div>
		</div>
		<div class="container mb-auto">
			<div class="user-panel ishadow">
				<img src="images/icon-photo.svg" alt="">
			</div>
			<h6 class="user-info mb-4">
				<a href="#" data-bs-toggle="modal" data-bs-target="#listcontact">
					Add photo
				</a>
			</h6>
			<a class="row card-item align-items-center" href="#">
				<div class="col">
					<div class="d-flex align-items-center ps-2">
						<div class="card-left-img">
							<img src="images/icon-menu-profile.svg" alt="">
						</div>
						<div class="card-content">
							<h4 class="card-title">My personal details</h4>
							<p class="card-dec">Edit your name, mobile number ...</p>
						</div>
					</div>
				</div>
				<div class="col-auto text-end">
					<img class="pe-2" src="images/icon-arrow.svg" alt="">
				</div>
			</a>
			<a class="row card-item align-items-center" href="#">
				<div class="col">
					<div class="d-flex align-items-center ps-2">
						<div class="card-left-img">
							<img src="images/icon-menu-lock.svg" alt="">
						</div>
						<div class="card-content">
							<h4 class="card-title">My login details</h4>
							<p class="card-dec">Edit your email, password ...</p>
						</div>
					</div>
				</div>
				<div class="col-auto text-end">
					<img class="pe-2" src="images/icon-arrow.svg" alt="">
				</div>
			</a>
			<a class="row card-item align-items-center" href="#">
				<div class="col">
					<div class="d-flex align-items-center ps-2">
						<div class="card-left-img">
							<img src="images/icon-menu-notifications.svg" alt="">
						</div>
						<div class="card-content">
							<h4 class="card-title">Notification settings</h4>
							<p class="card-dec">Manage your notifications</p>
						</div>
					</div>
				</div>
				<div class="col-auto text-end">
					<img class="pe-2" src="images/icon-arrow.svg" alt="">
				</div>
			</a>
			<a class="row card-item align-items-center" href="#">
				<div class="col">
					<div class="d-flex align-items-center ps-2">
						<div class="card-left-img">
							<img src="images/icon-menu-marketing.svg" alt="">
						</div>
						<div class="card-content">
							<h4 class="card-title">Marketing preferences</h4>
							<p class="card-dec">Manage marketing communication</p>
						</div>
					</div>
				</div>
				<div class="col-auto text-end">
					<img class="pe-2" src="images/icon-arrow.svg" alt="">
				</div>
			</a>
		</div>
		<div class="container pt-3">
			<p class="text-center my-3 text-gray"><a class="f-link" href="#">LOG OUT</a> <br> 
			Version 22.0001.01</p>
		</div>
	</div>
	
	<div class="list-contact-modal modal fade px-0" id="listcontact" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="listcontactlabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered align-items-end">
			<div class="modal-content">
				<div class="modal-body">
					<div class="list-group">
						<a href="#" class="list-group-item">TAKE PHOTO</a>
						<a href="profile-photo-selection.html" class="list-group-item">CHOOSE PHOTO</a>
					</div>
					<button class="btn btn-primary w-100" type="button" data-bs-dismiss="modal" aria-label="Close">CANCEL</button>
				</div>
			</div>
		</div>	
	</div>	
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
