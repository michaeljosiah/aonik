<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="py-4 border-bottom">
			<div class="container">
				<div class="row align-items-center">
					<div class="col">
						<a href="profile.html">
							<svg width="13" height="20" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
								<path d="M9.89968 19.7993L12.021 17.678L2.12151 7.77848L0.000185311 9.8998L9.89968 19.7993Z" fill="#F37920"/>
								<path d="M12.0203 2.12132L9.899 0L-0.000494123 9.89949L2.12083 12.0208L12.0203 2.12132Z" fill="#F37920"/>
							</svg>
						</a>
					</div>
					<div class="col-auto text-center">
						<span class="title-top">Request help with payment</span>
					</div>
					<div class="col text-end">
						<a href="#"><img src="images/icon-close.svg" alt="x"></a>
					</div>
				</div>
			</div>
		</div>
		<div class="container mb-auto mt-4">
			<p class="mb-4">Please enter the details of the friend or family member that will be helping to pay this bill.</p>
			<div class="form-group">
				<label for="f-first-name">Friend first name</label>
				<input type="text" class="form-control" id="f-first-name" placeholder="Enter your friend first name">
			</div>
			<div class="form-group">
				<label for="f-last-name">Friend last name</label>
				<input type="text" class="form-control" id="f-last-name" placeholder="Enter your friend last name">
			</div>
			<div class="form-group">
				<label for="f-email">Friend email</label>
				<input type="email" class="form-control" id="f-email" placeholder="Enter your friend email">
			</div>
			<div class="form-group">
				<label for="f-label">Relationship <span>(optional)</span></label>
				<select id="f-label" class="form-control select-box" data-placeholder="Select relationship">
					<option></option>
					<option value="Relationship 01">Relationship 01</option>
					<option value="Relationship 02">Relationship 02</option>
				</select>
			</div>
			<div class="form-group pt-2">
				<div class="input-group upload-file d-flex align-items-center justify-content-between">
					<label for="formFile" class="form-label mb-0">Add friend picture</label>
					<div><input type="file" class="form-control" id="formFile"></div>
				</div>
			</div>
			<div class="form-group py-2">
				<div class="d-flex align-items-center justify-content-between form-check form-switch form-switch-lg ps-0">
					<label class="form-check-label pe-switch" for="customSwitch">Save friend</label>
					<input type="checkbox" class="form-check-input" id="customSwitch" checked>
				</div>
			</div>
		</div>
		<div class="container">
			<div class="form-group">
				<button class="btn btn-primary btn-md w-100">REQUEST HELP</button>
			</div>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
