<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container">
			<div class="py-4 mb-4">
				<a href="register-phone.html">
					<svg width="13" height="20" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M9.89968 19.7993L12.021 17.678L2.12151 7.77848L0.000185311 9.8998L9.89968 19.7993Z" fill="#F37920"/>
						<path d="M12.0203 2.12132L9.899 0L-0.000494123 9.89949L2.12083 12.0208L12.0203 2.12132Z" fill="#F37920"/>
					</svg>
				</a>
			</div>
			<h2 class="mb-4 pb-2">The code is</h2>
			<form class="form form-complete" action="#" method="post">
				<div id="otp" class="d-flex flex-row justify-content-center my-4 py-3"> 
					<input class="m-2 text-center form-control rounded" type="text" id="first" maxlength="1"> 
					<input class="m-2 text-center form-control rounded" type="text" id="second" maxlength="1"> 
					<input class="m-2 text-center form-control rounded" type="text" id="third" maxlength="1"> 
					<input class="m-2 text-center form-control rounded" type="text" id="fourth" maxlength="1"> 
					<input class="m-2 text-center form-control rounded" type="text" id="fifth" maxlength="1"> 
					<input class="m-2 text-center form-control rounded" type="text" id="sixth" maxlength="1"> 
				</div>
				<button type="submit" class="btn btn-primary disabled my-3 w-100">NEXT</button>
				<p class="text-center my-3"><a href="#">Request new code</a></p>
			</form>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
