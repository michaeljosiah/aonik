<svg width="280" height="240" viewBox="0 0 280 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft circular backdrop -->
  <circle cx="140" cy="120" r="100" fill="#F0E6D6" opacity="0.45"/>

  <!-- Back card (tilted slightly right) — represents an account/transaction card -->
  <g transform="translate(80, 52) rotate(4, 60, 52)">
    <rect width="160" height="104" rx="16" fill="#5C4033" opacity="0.85"/>
    <!-- Card stripe -->
    <rect x="16" y="20" width="80" height="8" rx="4" fill="#F0E6D6" opacity="0.50"/>
    <rect x="16" y="36" width="52" height="6" rx="3" fill="#F0E6D6" opacity="0.30"/>
    <!-- Amount block -->
    <rect x="16" y="64" width="40" height="14" rx="4" fill="#D4A574" opacity="0.70"/>
    <rect x="64" y="68" width="28" height="6" rx="3" fill="#F0E6D6" opacity="0.25"/>
    <!-- Card chip -->
    <rect x="120" y="18" width="24" height="18" rx="4" fill="#D4A574" opacity="0.50"/>
  </g>

  <!-- Front card (tilted slightly left) — represents a transaction row -->
  <g transform="translate(56, 88) rotate(-3, 84, 40)">
    <rect width="168" height="80" rx="14" fill="#FFFCF9" stroke="#E8D5C0" stroke-width="1"/>
    <!-- Transaction icon circle -->
    <circle cx="32" cy="40" r="16" fill="#D4A574" opacity="0.20"/>
    <circle cx="32" cy="40" r="7" fill="#8B5E3C"/>
    <!-- Merchant name + category -->
    <rect x="56" y="28" width="64" height="8" rx="4" fill="#5C4033" opacity="0.75"/>
    <rect x="56" y="42" width="40" height="6" rx="3" fill="#5C4033" opacity="0.30"/>
    <!-- Amount -->
    <rect x="128" y="30" width="28" height="10" rx="4" fill="#5C4033" opacity="0.65"/>
    <rect x="128" y="44" width="20" height="5" rx="2.5" fill="#5C4033" opacity="0.20"/>
  </g>

  <!-- Small accent dots -->
  <circle cx="68" cy="68" r="4" fill="#D4A574" opacity="0.40"/>
  <circle cx="212" cy="168" r="5" fill="#D4A574" opacity="0.30"/>
  <circle cx="196" cy="56" r="3" fill="#8B5E3C" opacity="0.20"/>
</svg>
