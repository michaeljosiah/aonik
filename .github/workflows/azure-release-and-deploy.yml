name: Azure Release and Deploy

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Deployment profile"
        required: true
        default: "aca"
        type: choice
        options:
          - aca
          - appservice
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      build_images:
        description: "Build/push images before runtime deployment"
        required: true
        default: true
        type: boolean
      image_version:
        description: "Required when build_images=false"
        required: false
        default: ""
        type: string
      image_tag:
        description: "Optional image tag override when build_images=true (defaults to git SHA)"
        required: false
        default: ""
        type: string
      resource_group:
        description: "Azure resource group override (optional)"
        required: false
        default: ""
        type: string
      workload_name:
        description: "Workload name override used for ACR derivation"
        required: false
        default: ""
        type: string
      use_digest_references:
        description: "Use registry digest references in deployment parameters"
        required: true
        default: true
        type: boolean
      mode:
        description: "Run what-if preview or deploy"
        required: true
        default: "what-if"
        type: choice
        options:
          - what-if
          - deploy
      skip_image_validation:
        description: "Advanced/emergency only: skip preflight image validation"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  validate-inputs:
    name: Validate orchestrator inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate image version requirements
        run: |
          set -euo pipefail

          build_images="${{ inputs.build_images }}"
          image_version="${{ inputs.image_version }}"

          if [ "$build_images" = "false" ] && [ -z "$image_version" ]; then
            echo "image_version is required when build_images=false." >&2
            exit 1
          fi

  release-images:
    name: Release runtime images
    needs: validate-inputs
    if: ${{ inputs.build_images }}
    uses: ./.github/workflows/azure-image-release.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
      workload_name: ${{ inputs.workload_name }}
    secrets: inherit

  runtime-deploy:
    name: Deploy runtime
    needs:
      - validate-inputs
      - release-images
    if: ${{ always() && needs.validate-inputs.result == 'success' && (needs.release-images.result == 'success' || needs.release-images.result == 'skipped') }}
    uses: ./.github/workflows/azure-runtime-deploy.yml
    with:
      profile: ${{ inputs.profile }}
      environment: ${{ inputs.environment }}
      resource_group: ${{ inputs.resource_group }}
      workload_name: ${{ inputs.workload_name }}
      image_version: ${{ inputs.build_images && needs.release-images.outputs.release_version || inputs.image_version }}
      use_digest_references: ${{ inputs.use_digest_references }}
      mode: ${{ inputs.mode }}
      skip_image_validation: ${{ inputs.skip_image_validation }}
    secrets: inherit
