name: "CD: Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      resource_group:
        description: "Azure resource group override (optional)"
        required: false
        default: ""
        type: string
      workload_name:
        description: "Workload name override used for naming and default ACR derivation"
        required: false
        default: ""
        type: string
      location:
        description: "Azure region override (optional)"
        required: false
        default: ""
        type: string
      mode:
        description: "Run what-if preview or deploy"
        required: true
        default: "what-if"
        type: choice
        options:
          - what-if
          - deploy
      bootstrap_api_image:
        description: "Temporary API bootstrap image (should listen on port 8080)"
        required: false
        default: "mcr.microsoft.com/dotnet/samples:aspnetapp"
        type: string
      bootstrap_worker_image:
        description: "Temporary worker bootstrap image"
        required: false
        default: "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
        type: string
      bootstrap_adminui_image:
        description: "Temporary Admin UI bootstrap image (should listen on configured admin UI target port)"
        required: false
        default: "mcr.microsoft.com/dotnet/samples:aspnetapp"
        type: string
      bootstrap_adminui_target_port:
        description: "Temporary Admin UI bootstrap target port"
        required: false
        default: "8080"
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Bootstrap platform (aca / ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TEMPLATE_FILE: iac/azure/stacks/aca/main.bicep
      PARAM_FILE: iac/azure/environments/${{ inputs.environment }}/aca.parameters.json
      EFFECTIVE_PARAM_FILE: iac/azure/environments/${{ inputs.environment }}/aca.bootstrap.parameters.json
      RESOURCE_GROUP: ${{ inputs.resource_group != '' && inputs.resource_group || vars.AZURE_RESOURCE_GROUP }}
      WORKLOAD_NAME: ${{ inputs.workload_name != '' && inputs.workload_name || vars.WORKLOAD_NAME }}
      BOOTSTRAP_API_IMAGE: ${{ inputs.bootstrap_api_image }}
      BOOTSTRAP_WORKER_IMAGE: ${{ inputs.bootstrap_worker_image }}
      BOOTSTRAP_ADMINUI_IMAGE: ${{ inputs.bootstrap_adminui_image }}
      BOOTSTRAP_ADMINUI_TARGET_PORT: ${{ inputs.bootstrap_adminui_target_port }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          client_id: ${{ vars.AZURE_CLIENT_ID }}
          tenant_id: ${{ vars.AZURE_TENANT_ID }}
          subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Validate required deployment settings
        run: |
          test -n "$RESOURCE_GROUP" || (echo "RESOURCE_GROUP is empty. Set workflow input 'resource_group' or environment variable AZURE_RESOURCE_GROUP." && exit 1)
          test -f "$TEMPLATE_FILE"
          test -f "$PARAM_FILE"

      - name: Build bootstrap parameter file
        uses: ./.github/actions/resolve-params
        with:
          base_param_file: ${{ env.PARAM_FILE }}
          output_param_file: ${{ env.EFFECTIVE_PARAM_FILE }}
          mode: bootstrap
          workload_name: ${{ env.WORKLOAD_NAME }}
          bootstrap_images: >-
            {"apiImage":"${{ env.BOOTSTRAP_API_IMAGE }}","workerImage":"${{ env.BOOTSTRAP_WORKER_IMAGE }}","adminUiImage":"${{ env.BOOTSTRAP_ADMINUI_IMAGE }}"}
          admin_ui_target_port: ${{ env.BOOTSTRAP_ADMINUI_TARGET_PORT }}

      - name: Deploy
        uses: ./.github/actions/bicep-deploy
        with:
          mode: ${{ inputs.mode }}
          resource_group: ${{ env.RESOURCE_GROUP }}
          template_file: ${{ env.TEMPLATE_FILE }}
          param_file: ${{ env.EFFECTIVE_PARAM_FILE }}
          extra_params: >-
            --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
            --parameters "acsConnectionString=${{ secrets.ACS_CONNECTION_STRING }}"
            --parameters "verificationHashKey=${{ secrets.VERIFICATION_HASH_KEY }}"
            --parameters "alertsSharedSecret=${{ secrets.ALERTS_SHARED_SECRET }}"
            ${{ inputs.location != '' && format('--parameters "location={0}"', inputs.location) || '' }}
