name: "CD: Infrastructure"

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Infrastructure profile to deploy"
        required: true
        default: "aca"
        type: choice
        options:
          - aca
          - appservice
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      resource_group:
        description: "Azure resource group override (optional)"
        required: false
        default: ""
        type: string
      workload_name:
        description: "Workload name override used for naming and default ACR derivation"
        required: false
        default: ""
        type: string
      location:
        description: "Azure region override (optional)"
        required: false
        default: ""
        type: string
      mode:
        description: "Run what-if preview or deploy"
        required: true
        default: "what-if"
        type: choice
        options:
          - what-if
          - deploy
      bootstrap_api_image:
        description: "Temporary API bootstrap image (should listen on port 8080)"
        required: false
        default: "mcr.microsoft.com/dotnet/samples:aspnetapp"
        type: string
      bootstrap_worker_image:
        description: "Temporary worker bootstrap image"
        required: false
        default: "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
        type: string
      bootstrap_adminui_image:
        description: "Temporary Admin UI bootstrap image (should listen on configured admin UI target port)"
        required: false
        default: "mcr.microsoft.com/dotnet/samples:aspnetapp"
        type: string
      bootstrap_adminui_target_port:
        description: "Temporary Admin UI bootstrap target port"
        required: false
        default: "8080"
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Bootstrap platform (${{ inputs.profile }} / ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TEMPLATE_FILE: iac/azure/stacks/${{ inputs.profile }}/main.bicep
      PARAM_FILE: iac/azure/environments/${{ inputs.environment }}/${{ inputs.profile }}.parameters.json
      EFFECTIVE_PARAM_FILE: iac/azure/environments/${{ inputs.environment }}/${{ inputs.profile }}.bootstrap.parameters.json
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      RESOURCE_GROUP: ${{ inputs.resource_group != '' && inputs.resource_group || vars.AZURE_RESOURCE_GROUP }}
      WORKLOAD_NAME: ${{ inputs.workload_name != '' && inputs.workload_name || vars.WORKLOAD_NAME }}
      BOOTSTRAP_API_IMAGE: ${{ inputs.bootstrap_api_image }}
      BOOTSTRAP_WORKER_IMAGE: ${{ inputs.bootstrap_worker_image }}
      BOOTSTRAP_ADMINUI_IMAGE: ${{ inputs.bootstrap_adminui_image }}
      BOOTSTRAP_ADMINUI_TARGET_PORT: ${{ inputs.bootstrap_adminui_target_port }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (Service Principal Secret fallback)
        if: ${{ env.AZURE_CLIENT_SECRET != '' }}
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ env.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Azure login (OIDC)
        if: ${{ env.AZURE_CLIENT_SECRET == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required deployment settings
        run: |
          test -n "$RESOURCE_GROUP" || (echo "RESOURCE_GROUP is empty. Set workflow input 'resource_group' or environment variable AZURE_RESOURCE_GROUP." && exit 1)
          test -f "$TEMPLATE_FILE"
          test -f "$PARAM_FILE"

      - name: Build bootstrap parameter file
        uses: ./.github/actions/resolve-params
        with:
          base_param_file: ${{ env.PARAM_FILE }}
          output_param_file: ${{ env.EFFECTIVE_PARAM_FILE }}
          mode: bootstrap
          workload_name: ${{ env.WORKLOAD_NAME }}
          bootstrap_images: >-
            {"apiImage":"${{ env.BOOTSTRAP_API_IMAGE }}","workerImage":"${{ env.BOOTSTRAP_WORKER_IMAGE }}","adminUiImage":"${{ env.BOOTSTRAP_ADMINUI_IMAGE }}"}
          admin_ui_target_port: ${{ env.BOOTSTRAP_ADMINUI_TARGET_PORT }}

      - name: Compile Bicep template
        run: az bicep build --file "$TEMPLATE_FILE"

      - name: What-if deployment preview
        if: ${{ inputs.mode == 'what-if' }}
        run: |
          set +e

          what_if_args=(
            --resource-group "$RESOURCE_GROUP"
            --template-file "$TEMPLATE_FILE"
            --parameters "@$EFFECTIVE_PARAM_FILE"
            --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
            --parameters "acsConnectionString=${{ secrets.ACS_CONNECTION_STRING }}"
            --parameters "verificationHashKey=${{ secrets.VERIFICATION_HASH_KEY }}"
          )

          if [ -n "${{ inputs.location }}" ]; then
            what_if_args+=(--parameters "location=${{ inputs.location }}")
          fi

          what_if_output=$(az deployment group what-if "${what_if_args[@]}" 2>&1)
          what_if_exit_code=$?

          if [ $what_if_exit_code -eq 0 ]; then
            echo "$what_if_output"
            exit 0
          fi

          echo "$what_if_output"

          if [[ "$what_if_output" == *"Microsoft.Resources/deployments/whatIf/action"* ]] || [[ "$what_if_output" == *"AuthorizationFailed"* ]]; then
            echo "what-if permissions are missing. Falling back to template validation for this run."

            validate_args=(
              --resource-group "$RESOURCE_GROUP"
              --template-file "$TEMPLATE_FILE"
              --parameters "@$EFFECTIVE_PARAM_FILE"
              --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
              --parameters "acsConnectionString=${{ secrets.ACS_CONNECTION_STRING }}"
              --parameters "verificationHashKey=${{ secrets.VERIFICATION_HASH_KEY }}"
            )

            if [ -n "${{ inputs.location }}" ]; then
              validate_args+=(--parameters "location=${{ inputs.location }}")
            fi

            az deployment group validate "${validate_args[@]}"
            exit 0
          fi

          exit $what_if_exit_code

      - name: Deploy infrastructure baseline
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          deploy_args=(
            --resource-group "$RESOURCE_GROUP"
            --template-file "$TEMPLATE_FILE"
            --parameters "@$EFFECTIVE_PARAM_FILE"
            --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
            --parameters "acsConnectionString=${{ secrets.ACS_CONNECTION_STRING }}"
            --parameters "verificationHashKey=${{ secrets.VERIFICATION_HASH_KEY }}"
          )

          if [ -n "${{ inputs.location }}" ]; then
            deploy_args+=(--parameters "location=${{ inputs.location }}")
          fi

          az deployment group create "${deploy_args[@]}"
