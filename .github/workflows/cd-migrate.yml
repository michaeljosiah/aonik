name: "CD: Migrate Database"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      mode:
        description: "Migration mode"
        required: true
        default: "migrate-and-seed"
        type: choice
        options:
          - migrate-and-seed
          - migrate-only
          - seed-only
      workload_name:
        description: "Workload name override (optional)"
        required: false
        default: ""
        type: string
      source_ref:
        description: "Optional git ref or commit SHA to checkout"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run — list pending migrations without applying"
        required: true
        default: false
        type: boolean
      reset:
        description: "Drop and recreate database before migrating (destructive!)"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Run migrator (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      WORKLOAD_NAME: ${{ inputs.workload_name != '' && inputs.workload_name || vars.WORKLOAD_NAME || 'aonik' }}

    steps:
      - name: Block --reset on production
        if: ${{ inputs.reset && inputs.environment == 'prod' }}
        run: |
          echo "::error::--reset is permanently blocked for production. This would destroy all data."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          client_id: ${{ vars.AZURE_CLIENT_ID }}
          tenant_id: ${{ vars.AZURE_TENANT_ID }}
          subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Resolve Key Vault name
        id: kv
        run: |
          set -euo pipefail
          workload=$(echo "${WORKLOAD_NAME}" | tr '[:upper:]' '[:lower:]')
          environment=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          kv_name="${workload}-${environment}-kv"
          echo "name=${kv_name}" >> "$GITHUB_OUTPUT"
          echo "Key Vault: ${kv_name}"

      - name: Fetch connection string from Key Vault
        id: secret
        run: |
          set -euo pipefail
          connection_string=$(az keyvault secret show \
            --vault-name "${{ steps.kv.outputs.name }}" \
            --name "ConnectionStrings--DefaultConnection" \
            --query value -o tsv)

          if [ -z "$connection_string" ]; then
            echo "Failed to retrieve connection string from Key Vault '${{ steps.kv.outputs.name }}'." >&2
            exit 1
          fi

          echo "::add-mask::${connection_string}"
          echo "connection_string=${connection_string}" >> "$GITHUB_OUTPUT"
          echo "Connection string retrieved successfully."

      - name: Build migrator
        run: dotnet build src/Aonik.Migrator/Aonik.Migrator.csproj --configuration Release

      - name: Validate canonical migration stream
        run: dotnet ef migrations has-pending-model-changes --project src/Aonik.Infrastructure --startup-project src/Aonik.Migrator --configuration Release --no-build

      - name: List pending migrations (dry run)
        if: ${{ inputs.dry_run }}
        env:
          ConnectionStrings__DefaultConnection: ${{ steps.secret.outputs.connection_string }}
        run: |
          set -euo pipefail
          dotnet ef migrations list \
            --project src/Aonik.Infrastructure \
            --startup-project src/Aonik.Migrator \
            --configuration Release \
            --no-build
          echo "Dry run complete — no migrations were applied."

      - name: Provision Quartz schema (idempotent)
        if: ${{ !inputs.dry_run }}
        env:
          ConnectionStrings__DefaultConnection: ${{ steps.secret.outputs.connection_string }}
        run: |
          set -euo pipefail
          SCRIPT="database/quartz-schema-sqlserver.sql"
          if [ -f "$SCRIPT" ]; then
            echo "Applying Quartz schema (idempotent — uses IF NOT EXISTS)..."
            # Install sqlcmd via the mssql-tools package
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
            sudo add-apt-repository "$(curl -sSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list)" 2>/dev/null || true
            sudo apt-get update -qq && sudo apt-get install -y -qq sqlcmd 2>/dev/null || sudo apt-get install -y -qq mssql-tools18 unixodbc-dev 2>/dev/null || true

            # Parse connection string components
            SERVER=$(echo "$ConnectionStrings__DefaultConnection" | grep -oP 'Server=tcp:\K[^;]+')
            DATABASE=$(echo "$ConnectionStrings__DefaultConnection" | grep -oP 'Initial Catalog=\K[^;]+')
            USER=$(echo "$ConnectionStrings__DefaultConnection" | grep -oP 'User ID=\K[^;]+')
            PASSWORD=$(echo "$ConnectionStrings__DefaultConnection" | grep -oP 'Password=\K[^;]+')

            # Try sqlcmd (go-sqlcmd) first, fall back to /opt/mssql-tools18/bin/sqlcmd
            SQLCMD="sqlcmd"
            command -v sqlcmd >/dev/null 2>&1 || SQLCMD="/opt/mssql-tools18/bin/sqlcmd"

            $SQLCMD -S "tcp:${SERVER}" -d "$DATABASE" -U "$USER" -P "$PASSWORD" -i "$SCRIPT" -C
            echo "Quartz schema provisioned."
          else
            echo "No Quartz schema script found at $SCRIPT — skipping."
          fi

      - name: Run migrator
        if: ${{ !inputs.dry_run }}
        env:
          ConnectionStrings__DefaultConnection: ${{ steps.secret.outputs.connection_string }}
        run: |
          set -euo pipefail

          mode="${{ inputs.mode }}"
          args=""

          case "$mode" in
            migrate-only)
              args="--migrate-only"
              ;;
            seed-only)
              args="--seed-only"
              ;;
            migrate-and-seed)
              # default behaviour — no args needed
              ;;
          esac

          if [ "${{ inputs.reset }}" = "true" ]; then
            args="$args --reset"
          fi

          echo "Running migrator (mode: ${mode}, reset: ${{ inputs.reset }})..."
          dotnet run \
            --project src/Aonik.Migrator/Aonik.Migrator.csproj \
            --configuration Release \
            --no-build \
            -- $args

      - name: Restart API container after --reset
        if: ${{ !inputs.dry_run && inputs.reset }}
        run: |
          set -euo pipefail
          workload=$(echo "${WORKLOAD_NAME}" | tr '[:upper:]' '[:lower:]')
          environment=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          rg="rg-${workload}-${environment}-uksouth"
          app="${workload}-${environment}-api"

          echo "Restarting ${app} so hosted services re-seed data wiped by --reset..."
          revision=$(az containerapp revision list \
            --name "$app" \
            --resource-group "$rg" \
            --query "[0].name" -o tsv)
          az containerapp revision restart \
            --name "$app" \
            --resource-group "$rg" \
            --revision "$revision"
          echo "API container restarted."
