name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: dotnet restore Aonik.sln

      - name: Validate canonical migration stream
        run: dotnet ef migrations has-pending-model-changes --project src/Aonik.Infrastructure --startup-project src/Aonik.Migrator

      - name: Build solution
        run: dotnet build Aonik.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Aonik.sln --configuration Release --no-build

      - name: Publish API artifact
        run: dotnet publish src/Aonik.Api/Aonik.Api.csproj --configuration Release --no-build --output artifacts/api

      - name: Package release artifact
        run: |
          cd artifacts
          tar -czf aonik-api-${{ github.ref_name }}.tar.gz api

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: aonik-api-${{ github.ref_name }}
          path: artifacts/aonik-api-${{ github.ref_name }}.tar.gz

  create-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: aonik-api-${{ github.ref_name }}
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz
