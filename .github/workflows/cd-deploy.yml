name: "CD: Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      resource_group:
        description: "Azure resource group override (optional)"
        required: false
        default: ""
        type: string
      workload_name:
        description: "Workload name override used for ACR derivation"
        required: false
        default: ""
        type: string
      acr_login_server:
        description: "Optional ACR login server override"
        required: false
        default: ""
        type: string
      image_version:
        description: "Required immutable release version tag (defaults to current SHA)"
        required: false
        default: ""
        type: string
      use_digest_references:
        description: "Use registry digest references in deployment parameters"
        required: true
        default: true
        type: boolean
      location:
        description: "Azure region override (optional)"
        required: false
        default: ""
        type: string
      mode:
        description: "Run what-if preview or deploy"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - what-if
      skip_image_validation:
        description: "Advanced/emergency only: skip preflight image validation"
        required: true
        default: false
        type: boolean
      source_ref:
        description: "Optional git ref or commit SHA to checkout"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      resource_group:
        required: false
        default: ""
        type: string
      workload_name:
        required: false
        default: ""
        type: string
      acr_login_server:
        required: false
        default: ""
        type: string
      image_version:
        required: false
        default: ""
        type: string
      use_digest_references:
        required: false
        default: true
        type: boolean
      location:
        required: false
        default: ""
        type: string
      mode:
        required: false
        default: "deploy"
        type: string
      skip_image_validation:
        required: false
        default: false
        type: boolean
      source_ref:
        required: false
        default: ""
        type: string
    secrets:
      SQL_ADMIN_PASSWORD:
        required: true
      ACS_CONNECTION_STRING:
        required: false
      VERIFICATION_HASH_KEY:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      BOOTSTRAP_SETUP_SECRET:
        required: false
      ALERTS_SHARED_SECRET:
        required: false

permissions:
  id-token: write
  contents: read

## No workflow-level concurrency guard here.
## Standalone environment protection rules prevent overlapping
## deployments, and callers can add higher-level orchestration locks
## without risking nested deadlocks here.

jobs:
  deploy:
    name: Runtime deploy (aca / ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TEMPLATE_FILE: iac/azure/stacks/aca/main.bicep
      PARAM_FILE: iac/azure/environments/${{ inputs.environment }}/aca.parameters.json
      EFFECTIVE_PARAM_FILE: iac/azure/environments/${{ inputs.environment }}/aca.runtime.parameters.json
      RESOURCE_GROUP: ${{ inputs.resource_group != '' && inputs.resource_group || vars.AZURE_RESOURCE_GROUP }}
      WORKLOAD_NAME: ${{ inputs.workload_name != '' && inputs.workload_name || vars.WORKLOAD_NAME }}
      ACR_LOGIN_SERVER_OVERRIDE: ${{ inputs.acr_login_server }}
      # Explicit app settings — any env var matching a recognised prefix is
      # forwarded to the API or Worker container.  Add new settings here as
      # individual vars/secrets instead of a JSON blob.
      #
      # AI
      AI__PROVIDER: ${{ vars.AI__PROVIDER }}
      AI__OPENAI__MODEL: ${{ vars.AI__OPENAI__MODEL }}
      AI__OPENAI__APIKEY: ${{ secrets.AI__OPENAI__APIKEY }}
      # Auth (Settings module IdP management)
      SETTINGS__AUTH_PROVIDER: ${{ vars.SETTINGS__AUTH_PROVIDER }}
      SETTINGS__AUTH_AUTH0_DOMAIN: ${{ vars.SETTINGS__AUTH_AUTH0_DOMAIN }}
      SETTINGS__AUTH_AUTH0_AUDIENCE: ${{ vars.SETTINGS__AUTH_AUTH0_AUDIENCE }}
      SETTINGS__AUTH_AUTH0_CLIENTID: ${{ vars.SETTINGS__AUTH_AUTH0_CLIENTID }}
      SETTINGS__AUTH_AUTH0_MANAGEMENTCLIENTID: ${{ vars.SETTINGS__AUTH_AUTH0_MANAGEMENTCLIENTID }}
      SETTINGS__AUTH_AUTH0_MANAGEMENTCLIENTSECRET: ${{ secrets.SETTINGS__AUTH_AUTH0_MANAGEMENTCLIENTSECRET }}
      SETTINGS__AUTH_AUTH0_CONNECTION: ${{ vars.SETTINGS__AUTH_AUTH0_CONNECTION }}
      SETTINGS__AUTH_AUTH0_MANAGEMENTAUDIENCE: ${{ vars.SETTINGS__AUTH_AUTH0_MANAGEMENTAUDIENCE }}
      # Plaid (Personal Finance linked accounts)
      FINANCE__PERSONALFINANCE__PLAID__USEREALPLAIDAPI: ${{ vars.FINANCE__PERSONALFINANCE__PLAID__USEREALPLAIDAPI }}
      FINANCE__PERSONALFINANCE__PLAID__BASEURL: ${{ vars.FINANCE__PERSONALFINANCE__PLAID__BASEURL }}
      FINANCE__PERSONALFINANCE__PLAID__CLIENTID: ${{ vars.FINANCE__PERSONALFINANCE__PLAID__CLIENTID }}
      FINANCE__PERSONALFINANCE__PLAID__SECRET: ${{ secrets.FINANCE__PERSONALFINANCE__PLAID__SECRET }}
      FINANCE__PERSONALFINANCE__PLAID__WEBHOOKURL: ${{ vars.FINANCE__PERSONALFINANCE__PLAID__WEBHOOKURL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}

      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          client_id: ${{ vars.AZURE_CLIENT_ID }}
          tenant_id: ${{ vars.AZURE_TENANT_ID }}
          subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Validate deployment files
        run: |
          test -n "$RESOURCE_GROUP" || (echo "RESOURCE_GROUP is empty. Set workflow input 'resource_group' or environment variable AZURE_RESOURCE_GROUP." && exit 1)
          test -f "$TEMPLATE_FILE"
          test -f "$PARAM_FILE"

      - name: Build app settings from explicit env vars
        id: app-settings
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          # Collect API app settings from explicit env vars.
          # Any env var whose name starts with a recognised prefix is forwarded
          # to the API container as a .NET configuration environment variable.
          # Add new prefixes here when new config sections need runtime overrides.
          API_SETTING_PREFIXES = (
              "AI__",
              "SETTINGS__",
              "FINANCE__",
          )

          api = {}
          for key, val in sorted(os.environ.items()):
              if any(key.startswith(p) for p in API_SETTING_PREFIXES) and val.strip():
                  api[key] = val.strip()

          # Worker settings use WORKER__ prefix.
          WORKER_SETTING_PREFIXES = ("WORKER__",)
          worker = {}
          for key, val in sorted(os.environ.items()):
              if any(key.startswith(p) for p in WORKER_SETTING_PREFIXES) and val.strip():
                  worker[key] = val.strip()

          merged = {}
          if api:
              merged["apiAppSettings"] = api
          if worker:
              merged["workerAppSettings"] = worker

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"app_settings_json={json.dumps(merged)}\n")

          print(f"Collected {len(api)} API and {len(worker)} Worker settings")
          PY

      - name: Resolve and validate runtime images
        id: resolve-params
        uses: ./.github/actions/resolve-params
        with:
          base_param_file: ${{ env.PARAM_FILE }}
          output_param_file: ${{ env.EFFECTIVE_PARAM_FILE }}
          mode: runtime
          workload_name: ${{ env.WORKLOAD_NAME }}
          environment_name: ${{ inputs.environment }}
          release_version: ${{ inputs.image_version || github.sha }}
          acr_override: ${{ env.ACR_LOGIN_SERVER_OVERRIDE }}
          use_digest_references: ${{ inputs.use_digest_references }}
          skip_image_validation: ${{ inputs.skip_image_validation }}
          app_settings: ${{ steps.app-settings.outputs.app_settings_json }}

      - name: Deploy
        uses: ./.github/actions/bicep-deploy
        with:
          mode: ${{ inputs.mode }}
          resource_group: ${{ env.RESOURCE_GROUP }}
          template_file: ${{ env.TEMPLATE_FILE }}
          param_file: ${{ env.EFFECTIVE_PARAM_FILE }}
          extra_params: >-
            --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
            --parameters "acsConnectionString=${{ secrets.ACS_CONNECTION_STRING }}"
            --parameters "verificationHashKey=${{ secrets.VERIFICATION_HASH_KEY }}"
            --parameters "bootstrapSetupSecret=${{ secrets.BOOTSTRAP_SETUP_SECRET }}"
            --parameters "alertsSharedSecret=${{ secrets.ALERTS_SHARED_SECRET }}"
            ${{ inputs.location != '' && format('--parameters "location={0}"', inputs.location) || '' }}
