name: "CD: Container Images"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for Azure credentials/variables"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: "Immutable image tag (defaults to git SHA)"
        required: false
        default: ""
        type: string
      semver_alias:
        description: "Optional mutable alias (example: v1.4.0)"
        required: false
        default: ""
        type: string
      workload_name:
        description: "Workload name override used for default ACR derivation"
        required: false
        default: ""
        type: string
      acr_name:
        description: "Optional ACR name override (without .azurecr.io)"
        required: false
        default: ""
        type: string
      source_ref:
        description: "Optional git ref or commit SHA to checkout"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: false
        default: ""
        type: string
      semver_alias:
        required: false
        default: ""
        type: string
      workload_name:
        required: false
        default: ""
        type: string
      acr_name:
        required: false
        default: ""
        type: string
      source_ref:
        required: false
        default: ""
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: false
    outputs:
      release_version:
        description: "Resolved immutable release version"
        value: ${{ jobs.release-images.outputs.release_version }}
      acr_name:
        description: "Resolved ACR registry name"
        value: ${{ jobs.release-images.outputs.acr_name }}
      acr_login_server:
        description: "Resolved ACR login server"
        value: ${{ jobs.release-images.outputs.acr_login_server }}

permissions:
  id-token: write
  contents: read

jobs:
  release-images:
    name: Build and push API/Worker/AdminUI images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      acr_name: ${{ steps.metadata.outputs.acr_name }}
      acr_login_server: ${{ steps.metadata.outputs.acr_login_server }}

    env:
      WORKLOAD_NAME: ${{ inputs.workload_name != '' && inputs.workload_name || vars.WORKLOAD_NAME }}
      ACR_NAME_OVERRIDE: ${{ inputs.acr_name }}
      VITE_AUTH_PROVIDER: ${{ vars.VITE_AUTH_PROVIDER }}
      VITE_AZURE_AD_CLIENT_ID: ${{ vars.VITE_AZURE_AD_CLIENT_ID }}
      VITE_AZURE_AD_TENANT_ID: ${{ vars.VITE_AZURE_AD_TENANT_ID }}
      VITE_AZURE_AD_REDIRECT_URI: ${{ vars.VITE_AZURE_AD_REDIRECT_URI }}
      VITE_AZURE_AD_API_SCOPE: ${{ vars.VITE_AZURE_AD_API_SCOPE }}
      VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
      VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
      VITE_AUTH0_REDIRECT_URI: ${{ vars.VITE_AUTH0_REDIRECT_URI }}
      VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}

      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Resolve release metadata
        id: metadata
        run: |
          set -euo pipefail

          image_tag_input="${{ inputs.image_tag }}"
          semver_alias="${{ inputs.semver_alias }}"
          environment_name="${{ inputs.environment }}"
          workload_name="${WORKLOAD_NAME:-aonik}"

          if [ -z "$workload_name" ]; then
            workload_name="aonik"
          fi

          if [ -n "$image_tag_input" ]; then
            release_version="$image_tag_input"
          else
            release_version="${GITHUB_SHA}"
          fi

          normalized_workload=$(echo "$workload_name" | tr '[:upper:]' '[:lower:]')
          normalized_environment=$(echo "$environment_name" | tr '[:upper:]' '[:lower:]')
          derived_acr_name="${normalized_workload}-${normalized_environment}acr"
          derived_acr_name="${derived_acr_name//-/}"

          acr_name="${ACR_NAME_OVERRIDE:-$derived_acr_name}"
          if [ -z "$acr_name" ]; then
            echo "Unable to resolve ACR name." >&2
            exit 1
          fi

          acr_login_server=$(az acr show --name "$acr_name" --query loginServer -o tsv)
          if [ -z "$acr_login_server" ]; then
            echo "Unable to resolve ACR login server for '$acr_name'. Run 'CD: Infrastructure' first." >&2
            exit 1
          fi

          {
            echo "release_version=$release_version"
            echo "semver_alias=$semver_alias"
            echo "acr_name=$acr_name"
            echo "acr_login_server=$acr_login_server"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ACR (via Azure identity)
        run: az acr login --name "${{ steps.metadata.outputs.acr_name }}"

      - name: Validate AdminUI build configuration
        run: |
          set -euo pipefail

          auth_provider="${VITE_AUTH_PROVIDER:-azure-ad}"
          api_base_url="${VITE_API_BASE_URL:-}"

          if [ -z "$api_base_url" ]; then
            echo "Missing GitHub environment variable: VITE_API_BASE_URL" >&2
            exit 1
          fi

          case "$auth_provider" in
            azure-ad)
              test -n "${VITE_AZURE_AD_CLIENT_ID:-}" || (echo "Missing GitHub environment variable: VITE_AZURE_AD_CLIENT_ID" >&2 && exit 1)
              test -n "${VITE_AZURE_AD_TENANT_ID:-}" || (echo "Missing GitHub environment variable: VITE_AZURE_AD_TENANT_ID" >&2 && exit 1)
              ;;
            auth0)
              test -n "${VITE_AUTH0_DOMAIN:-}" || (echo "Missing GitHub environment variable: VITE_AUTH0_DOMAIN" >&2 && exit 1)
              test -n "${VITE_AUTH0_CLIENT_ID:-}" || (echo "Missing GitHub environment variable: VITE_AUTH0_CLIENT_ID" >&2 && exit 1)
              ;;
            mock)
              ;;
            *)
              echo "Invalid VITE_AUTH_PROVIDER='$auth_provider'. Use azure-ad, auth0, or mock." >&2
              exit 1
              ;;
          esac

      - name: Build and push runtime images
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          SEMVER_ALIAS: ${{ steps.metadata.outputs.semver_alias }}
          ACR_LOGIN_SERVER: ${{ steps.metadata.outputs.acr_login_server }}
        run: |
          set -euo pipefail

          auth_provider="${VITE_AUTH_PROVIDER:-azure-ad}"

          build_and_push() {
            local service="$1"
            local dockerfile="$2"
            local image_ref="${ACR_LOGIN_SERVER}/${service}:${RELEASE_VERSION}"
            shift 2

            echo "Building ${image_ref}"
            docker build --file "$dockerfile" --tag "$image_ref" "$@" .
            docker push "$image_ref"

            digest=$(az acr repository show --name "${{ steps.metadata.outputs.acr_name }}" --image "${service}:${RELEASE_VERSION}" --query digest -o tsv)
            if [ -z "$digest" ]; then
              echo "Failed to resolve digest for ${service}:${RELEASE_VERSION}" >&2
              exit 1
            fi

            immutable_ref="${ACR_LOGIN_SERVER}/${service}@${digest}"
            service_key=${service//-/_}
            {
              printf '%s=%s\n' "${service_key}_tag" "$image_ref"
              printf '%s=%s\n' "${service_key}_digest" "$immutable_ref"
            } >> image-release.env

            if [ -n "$SEMVER_ALIAS" ]; then
              alias_ref="${ACR_LOGIN_SERVER}/${service}:${SEMVER_ALIAS}"
              docker tag "$image_ref" "$alias_ref"
              docker push "$alias_ref"
            fi
          }

          : > image-release.env
          build_and_push aonik-api docker/api.Dockerfile
          build_and_push aonik-worker docker/worker.Dockerfile
          build_and_push aonik-adminui docker/adminui.Dockerfile \
            --build-arg "VITE_AUTH_PROVIDER=${auth_provider}" \
            --build-arg "VITE_AZURE_AD_CLIENT_ID=${VITE_AZURE_AD_CLIENT_ID}" \
            --build-arg "VITE_AZURE_AD_TENANT_ID=${VITE_AZURE_AD_TENANT_ID}" \
            --build-arg "VITE_AZURE_AD_REDIRECT_URI=${VITE_AZURE_AD_REDIRECT_URI}" \
            --build-arg "VITE_AZURE_AD_API_SCOPE=${VITE_AZURE_AD_API_SCOPE}" \
            --build-arg "VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}" \
            --build-arg "VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}" \
            --build-arg "VITE_AUTH0_REDIRECT_URI=${VITE_AUTH0_REDIRECT_URI}" \
            --build-arg "VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE}" \
            --build-arg "VITE_API_BASE_URL=${VITE_API_BASE_URL}"

      - name: Scan images for vulnerabilities
        env:
          ACR_LOGIN_SERVER: ${{ steps.metadata.outputs.acr_login_server }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          set -euo pipefail

          # Install Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

          scan_failed=0
          for service in aonik-api aonik-worker aonik-adminui; do
            image="${ACR_LOGIN_SERVER}/${service}:${RELEASE_VERSION}"
            echo "Scanning ${image} ..."
            trivy image --severity HIGH,CRITICAL --exit-code 0 --format table "$image"
            # Fail on CRITICAL only; HIGH is informational
            if ! trivy image --severity CRITICAL --exit-code 1 --quiet "$image"; then
              echo "CRITICAL vulnerabilities found in ${service}" >&2
              scan_failed=1
            fi
          done

          if [ "$scan_failed" -ne 0 ]; then
            echo "Image release blocked: one or more images have CRITICAL vulnerabilities." >&2
            exit 1
          fi

      - name: Generate image release manifest
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          SEMVER_ALIAS: ${{ steps.metadata.outputs.semver_alias }}
          ACR_LOGIN_SERVER: ${{ steps.metadata.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          source image-release.env

          mkdir -p artifacts
          cat > artifacts/image-release-manifest.json <<JSON
          {
            "releaseVersion": "${RELEASE_VERSION}",
            "semverAlias": "${SEMVER_ALIAS}",
            "registry": "${ACR_LOGIN_SERVER}",
            "images": {
              "api": {
                "tag": "${aonik_api_tag}",
                "digest": "${aonik_api_digest}"
              },
              "worker": {
                "tag": "${aonik_worker_tag}",
                "digest": "${aonik_worker_digest}"
              },
              "adminUi": {
                "tag": "${aonik_adminui_tag}",
                "digest": "${aonik_adminui_digest}"
              }
            }
          }
          JSON

          cp image-release.env artifacts/image-release.env

      - name: Upload image release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-release-${{ steps.metadata.outputs.release_version }}
          path: artifacts/
