name: "CD: Dev Auto Deploy"

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  release-images:
    name: Release runtime images (dev)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    uses: ./.github/workflows/cd-images.yml
    with:
      environment: dev
      image_tag: ${{ github.event.workflow_run.head_sha }}
      source_ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  runtime-deploy:
    name: Deploy runtime (dev)
    needs: release-images
    if: ${{ needs.release-images.result == 'success' }}
    uses: ./.github/workflows/cd-deploy.yml
    with:
      environment: dev
      image_version: ${{ needs.release-images.outputs.release_version }}
      use_digest_references: true
      mode: deploy
      skip_image_validation: false
      source_ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
