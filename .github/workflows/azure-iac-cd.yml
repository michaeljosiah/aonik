name: Azure IaC CD

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Infrastructure profile to deploy"
        required: true
        default: "aca"
        type: choice
        options:
          - aca
          - appservice
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      resource_group:
        description: "Azure resource group override (optional)"
        required: false
        default: ""
        type: string
      location:
        description: "Azure region override (optional)"
        required: false
        type: string
      mode:
        description: "Run what-if preview or deploy"
        required: true
        default: "what-if"
        type: choice
        options:
          - what-if
          - deploy

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy IaC (${{ inputs.profile }} / ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TEMPLATE_FILE: infra/profiles/${{ inputs.profile }}/main.bicep
      PARAM_FILE: infra/environments/${{ inputs.environment }}/${{ inputs.profile }}.parameters.json
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      RESOURCE_GROUP: ${{ inputs.resource_group != '' && inputs.resource_group || vars.AZURE_RESOURCE_GROUP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (Service Principal Secret)
        if: ${{ env.AZURE_CLIENT_SECRET != '' }}
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ env.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Azure login (OIDC)
        if: ${{ env.AZURE_CLIENT_SECRET == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required deployment settings
        run: |
          test -n "$RESOURCE_GROUP" || (echo "RESOURCE_GROUP is empty. Set workflow input 'resource_group' or environment variable AZURE_RESOURCE_GROUP." && exit 1)

      - name: Validate template and parameter files exist
        run: |
          test -f "$TEMPLATE_FILE"
          test -f "$PARAM_FILE"

      - name: Compile Bicep template
        run: az bicep build --file "$TEMPLATE_FILE"

      - name: What-if deployment preview
        if: ${{ inputs.mode == 'what-if' }}
        run: |
          set +e

          what_if_args=(
            --resource-group "$RESOURCE_GROUP"
            --template-file "$TEMPLATE_FILE"
            --parameters "@$PARAM_FILE"
            --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
          )

          if [ -n "${{ inputs.location }}" ]; then
            what_if_args+=(--parameters "location=${{ inputs.location }}")
          fi

          what_if_output=$(az deployment group what-if "${what_if_args[@]}" 2>&1)
          what_if_exit_code=$?

          if [ $what_if_exit_code -eq 0 ]; then
            echo "$what_if_output"
            exit 0
          fi

          echo "$what_if_output"

          if [[ "$what_if_output" == *"Microsoft.Resources/deployments/whatIf/action"* ]] || [[ "$what_if_output" == *"AuthorizationFailed"* ]]; then
            echo "what-if permissions are missing. Falling back to template validation for this run."

            validate_args=(
              --resource-group "$RESOURCE_GROUP"
              --template-file "$TEMPLATE_FILE"
              --parameters "@$PARAM_FILE"
              --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
            )

            if [ -n "${{ inputs.location }}" ]; then
              validate_args+=(--parameters "location=${{ inputs.location }}")
            fi

            az deployment group validate "${validate_args[@]}"
            exit 0
          fi

          exit $what_if_exit_code

      - name: Deploy infrastructure
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set +e

          deployment_args=(
            --resource-group "$RESOURCE_GROUP"
            --template-file "$TEMPLATE_FILE"
            --parameters "@$PARAM_FILE"
            --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
          )

          if [ -n "${{ inputs.location }}" ]; then
            deployment_args+=(--parameters "location=${{ inputs.location }}")
          fi

          requested_sku=$(python -c 'import json; data=json.load(open("${{ env.PARAM_FILE }}", "r", encoding="utf-8")); print(data.get("parameters", {}).get("containerRegistrySku", {}).get("value", ""))')

          initial_sku="${requested_sku:-Basic}"
          sku_candidates=("$initial_sku" Basic Standard Premium)
          tried_skus=()

          for sku in "${sku_candidates[@]}"; do
            skip=false
            for tried in "${tried_skus[@]}"; do
              if [ "$tried" = "$sku" ]; then
                skip=true
                break
              fi
            done

            if [ "$skip" = true ]; then
              continue
            fi

            tried_skus+=("$sku")
            echo "Attempting deployment with containerRegistrySku=$sku"

            attempt_output=$(az deployment group create "${deployment_args[@]}" --parameters "containerRegistrySku=$sku" 2>&1)
            attempt_exit_code=$?

            if [ $attempt_exit_code -eq 0 ]; then
              echo "$attempt_output"
              echo "Deployment succeeded with containerRegistrySku=$sku"
              exit 0
            fi

            echo "$attempt_output"

            if [[ "$attempt_output" != *"SkuNotSupported"* ]]; then
              echo "Deployment failed for a non-SKU reason; not retrying with other SKUs."
              exit $attempt_exit_code
            fi

            echo "SKU '$sku' is not supported in this subscription/region context. Trying next SKU candidate..."
          done

          echo "Deployment failed after trying all ACR SKU candidates: ${tried_skus[*]}"
          exit 1
