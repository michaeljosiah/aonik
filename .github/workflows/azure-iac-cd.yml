name: Azure IaC CD

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Infrastructure profile to deploy"
        required: true
        default: "aca"
        type: choice
        options:
          - aca
          - appservice
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      resource_group:
        description: "Azure resource group name"
        required: true
        type: string
      location:
        description: "Azure region override (optional)"
        required: false
        type: string
      mode:
        description: "Run what-if preview or deploy"
        required: true
        default: "what-if"
        type: choice
        options:
          - what-if
          - deploy

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy IaC (${{ inputs.profile }} / ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TEMPLATE_FILE: infra/profiles/${{ inputs.profile }}/main.bicep
      PARAM_FILE: infra/environments/${{ inputs.environment }}/${{ inputs.profile }}.parameters.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (Service Principal Secret)
        if: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Azure login (OIDC)
        if: ${{ secrets.AZURE_CLIENT_SECRET == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate template and parameter files exist
        run: |
          test -f "$TEMPLATE_FILE"
          test -f "$PARAM_FILE"

      - name: Compile Bicep template
        run: az bicep build --file "$TEMPLATE_FILE"

      - name: What-if deployment preview
        if: ${{ inputs.mode == 'what-if' }}
        run: |
          if [ -n "${{ inputs.location }}" ]; then
            az deployment group what-if \
              --resource-group "${{ inputs.resource_group }}" \
              --template-file "$TEMPLATE_FILE" \
              --parameters "@$PARAM_FILE" \
              --parameters location="${{ inputs.location }}" \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"
          else
            az deployment group what-if \
              --resource-group "${{ inputs.resource_group }}" \
              --template-file "$TEMPLATE_FILE" \
              --parameters "@$PARAM_FILE" \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"
          fi

      - name: Deploy infrastructure
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          if [ -n "${{ inputs.location }}" ]; then
            az deployment group create \
              --resource-group "${{ inputs.resource_group }}" \
              --template-file "$TEMPLATE_FILE" \
              --parameters "@$PARAM_FILE" \
              --parameters location="${{ inputs.location }}" \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"
          else
            az deployment group create \
              --resource-group "${{ inputs.resource_group }}" \
              --template-file "$TEMPLATE_FILE" \
              --parameters "@$PARAM_FILE" \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"
          fi
