name: Azure IaC CD

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Infrastructure profile to deploy"
        required: true
        default: "aca"
        type: choice
        options:
          - aca
          - appservice
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      resource_group:
        description: "Azure resource group override (optional)"
        required: false
        default: ""
        type: string
      workload_name:
        description: "Workload name override for naming (used to derive default ACR login server)"
        required: false
        default: ""
        type: string
      acr_login_server:
        description: "ACR login server override used to replace REPLACE_WITH_ACR_LOGIN_SERVER placeholders (optional)"
        required: false
        default: ""
        type: string
      location:
        description: "Azure region override (optional)"
        required: false
        type: string
      mode:
        description: "Run what-if preview or deploy"
        required: true
        default: "what-if"
        type: choice
        options:
          - what-if
          - deploy

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy IaC (${{ inputs.profile }} / ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TEMPLATE_FILE: infra/profiles/${{ inputs.profile }}/main.bicep
      PARAM_FILE: infra/environments/${{ inputs.environment }}/${{ inputs.profile }}.parameters.json
      EFFECTIVE_PARAM_FILE: infra/environments/${{ inputs.environment }}/${{ inputs.profile }}.effective.parameters.json
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      RESOURCE_GROUP: ${{ inputs.resource_group != '' && inputs.resource_group || vars.AZURE_RESOURCE_GROUP }}
      WORKLOAD_NAME: ${{ inputs.workload_name != '' && inputs.workload_name || vars.WORKLOAD_NAME }}
      ACR_LOGIN_SERVER: ${{ inputs.acr_login_server != '' && inputs.acr_login_server || vars.ACR_LOGIN_SERVER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (Service Principal Secret)
        if: ${{ env.AZURE_CLIENT_SECRET != '' }}
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ env.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Azure login (OIDC)
        if: ${{ env.AZURE_CLIENT_SECRET == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required deployment settings
        run: |
          test -n "$RESOURCE_GROUP" || (echo "RESOURCE_GROUP is empty. Set workflow input 'resource_group' or environment variable AZURE_RESOURCE_GROUP." && exit 1)

      - name: Validate template and parameter files exist
        run: |
          test -f "$TEMPLATE_FILE"
          test -f "$PARAM_FILE"

      - name: Build effective parameter file
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          param_file = pathlib.Path(r"${{ env.PARAM_FILE }}")
          effective_param_file = pathlib.Path(r"${{ env.EFFECTIVE_PARAM_FILE }}")
          acr_login_server = r"${{ env.ACR_LOGIN_SERVER }}".strip()
          workload_name = r"${{ env.WORKLOAD_NAME }}".strip()
          deployment_environment = r"${{ inputs.environment }}".strip()

          document = json.loads(param_file.read_text())
          params = document.get("parameters", {})

          if not workload_name:
              workload_wrapper = params.get("workloadName")
              workload_value = workload_wrapper.get("value") if isinstance(workload_wrapper, dict) else None
              if isinstance(workload_value, str) and workload_value.strip():
                  workload_name = workload_value.strip()

          if not workload_name:
              workload_name = "aonik"

          if not acr_login_server:
              normalized_workload_name = workload_name.lower()
              normalized_environment = deployment_environment.lower()
              acr_name = f"{normalized_workload_name}-{normalized_environment}acr".replace("-", "")
              acr_login_server = f"{acr_name}.azurecr.io"

          print(f"Using workload_name={workload_name}")
          print(f"Using acr_login_server={acr_login_server}")

          if acr_login_server:
              for wrapper in params.values():
                  if not isinstance(wrapper, dict):
                      continue

                  value = wrapper.get("value")
                  if isinstance(value, str) and "REPLACE_WITH_ACR_LOGIN_SERVER" in value:
                      wrapper["value"] = value.replace("REPLACE_WITH_ACR_LOGIN_SERVER", acr_login_server)

          bad = []
          for key, wrapper in params.items():
              if key == "sqlAdminPassword":
                  continue

              value = wrapper.get("value") if isinstance(wrapper, dict) else None
              if isinstance(value, str) and value.startswith("REPLACE_WITH_"):
                  bad.append(f"{key}={value}")

          if bad:
              print(f"Parameter file {param_file} still contains placeholder values:")
              if not acr_login_server:
                  print("Hint: provide workflow input 'acr_login_server', set 'ACR_LOGIN_SERVER', or provide 'workload_name'/'workloadName' so the workflow can derive the ACR host.")
              for item in bad:
                  print(f"- {item}")
              print("Replace placeholders before running what-if/deploy.")
              sys.exit(1)

          effective_param_file.write_text(json.dumps(document, indent=2) + "\n")
          print(f"Wrote effective deployment parameters to {effective_param_file}")
          PY

      - name: Validate effective parameter file exists
        run: test -f "$EFFECTIVE_PARAM_FILE"

      - name: Compile Bicep template
        run: az bicep build --file "$TEMPLATE_FILE"

      - name: What-if deployment preview
        if: ${{ inputs.mode == 'what-if' }}
        run: |
          set +e

          what_if_args=(
            --resource-group "$RESOURCE_GROUP"
            --template-file "$TEMPLATE_FILE"
            --parameters "@$EFFECTIVE_PARAM_FILE"
            --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
          )

          if [ -n "${{ inputs.location }}" ]; then
            what_if_args+=(--parameters "location=${{ inputs.location }}")
          fi

          what_if_output=$(az deployment group what-if "${what_if_args[@]}" 2>&1)
          what_if_exit_code=$?

          if [ $what_if_exit_code -eq 0 ]; then
            echo "$what_if_output"
            exit 0
          fi

          echo "$what_if_output"

          if [[ "$what_if_output" == *"Microsoft.Resources/deployments/whatIf/action"* ]] || [[ "$what_if_output" == *"AuthorizationFailed"* ]]; then
            echo "what-if permissions are missing. Falling back to template validation for this run."

            validate_args=(
              --resource-group "$RESOURCE_GROUP"
              --template-file "$TEMPLATE_FILE"
              --parameters "@$EFFECTIVE_PARAM_FILE"
              --parameters "sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}"
            )

            if [ -n "${{ inputs.location }}" ]; then
              validate_args+=(--parameters "location=${{ inputs.location }}")
            fi

            az deployment group validate "${validate_args[@]}"
            exit 0
          fi

          exit $what_if_exit_code

      - name: Deploy infrastructure
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          if [ -n "${{ inputs.location }}" ]; then
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --template-file "$TEMPLATE_FILE" \
              --parameters "@$EFFECTIVE_PARAM_FILE" \
              --parameters location="${{ inputs.location }}" \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"
          else
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --template-file "$TEMPLATE_FILE" \
              --parameters "@$EFFECTIVE_PARAM_FILE" \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"
          fi
