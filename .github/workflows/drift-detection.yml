name: "Ops: Drift Detection"

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to check for drift"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  detect-drift:
    strategy:
      matrix:
        environment: ${{ github.event_name == 'schedule' && fromJSON('["dev","staging","prod"]') || fromJSON(format('["{0}"]', inputs.environment)) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    name: Drift check (${{ matrix.environment }})

    env:
      TEMPLATE_FILE: iac/azure/stacks/aca/main.bicep
      PARAM_FILE: iac/azure/environments/${{ matrix.environment }}/aca.parameters.json
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          client_id: ${{ vars.AZURE_CLIENT_ID }}
          tenant_id: ${{ vars.AZURE_TENANT_ID }}
          subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Run what-if drift check
        run: |
          set -euo pipefail

          echo "Checking drift for ${{ matrix.environment }}..."

          what_if_output=$(az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "@$PARAM_FILE" \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
            --parameters acsConnectionString="${{ secrets.ACS_CONNECTION_STRING }}" \
            --parameters verificationHashKey="${{ secrets.VERIFICATION_HASH_KEY }}" \
            --no-pretty-print 2>&1) || true

          echo "$what_if_output"

          # Check for actual resource changes (excluding NoChange)
          if echo "$what_if_output" | grep -qE '"changeType":\s*"(Create|Delete|Modify|Deploy)"'; then
            echo ""
            echo "::warning::Drift detected in ${{ matrix.environment }} environment. Review the what-if output above."
          else
            echo ""
            echo "No drift detected in ${{ matrix.environment }} environment."
          fi
