name: Bicep Deploy
description: >
  Compile, preview (what-if), or deploy a Bicep template. Encapsulates the
  what-if/AuthorizationFailed-fallback/deploy logic used by cd-infra and cd-deploy.

inputs:
  mode:
    description: '"what-if" or "deploy"'
    required: true
    default: what-if
  resource_group:
    description: Azure resource group name
    required: true
  template_file:
    description: Path to the Bicep template file
    required: true
  param_file:
    description: Path to the effective parameter file (prefixed with @)
    required: true
  extra_params:
    description: >
      Additional parameters passed verbatim to az deployment group (e.g.
      --parameters sqlAdminPassword=xxx --parameters location=eastus)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Compile Bicep template
      shell: bash
      run: az bicep build --file "${{ inputs.template_file }}"

    - name: What-if deployment preview
      if: ${{ inputs.mode == 'what-if' }}
      shell: bash
      run: |
        set +e

        what_if_args=(
          --resource-group "${{ inputs.resource_group }}"
          --template-file "${{ inputs.template_file }}"
          --parameters "@${{ inputs.param_file }}"
          ${{ inputs.extra_params }}
        )

        what_if_output=$(az deployment group what-if "${what_if_args[@]}" 2>&1)
        what_if_exit_code=$?

        if [ $what_if_exit_code -eq 0 ]; then
          echo "$what_if_output"
          exit 0
        fi

        echo "$what_if_output"

        if [[ "$what_if_output" == *"Microsoft.Resources/deployments/whatIf/action"* ]] || \
           [[ "$what_if_output" == *"AuthorizationFailed"* ]]; then
          echo "what-if permissions are missing. Falling back to template validation."

          validate_args=(
            --resource-group "${{ inputs.resource_group }}"
            --template-file "${{ inputs.template_file }}"
            --parameters "@${{ inputs.param_file }}"
            ${{ inputs.extra_params }}
          )

          az deployment group validate "${validate_args[@]}"
          exit 0
        fi

        exit $what_if_exit_code

    - name: Deploy
      if: ${{ inputs.mode == 'deploy' }}
      shell: bash
      run: |
        set +e

        deploy_args=(
          --resource-group "${{ inputs.resource_group }}"
          --template-file "${{ inputs.template_file }}"
          --parameters "@${{ inputs.param_file }}"
          ${{ inputs.extra_params }}
        )

        max_attempts=3
        attempt=1
        retry_delay_seconds=15

        while true; do
          echo "Starting deployment attempt ${attempt}/${max_attempts}"

          deploy_output=$(az deployment group create "${deploy_args[@]}" 2>&1)
          deploy_exit_code=$?

          echo "$deploy_output"

          if [ $deploy_exit_code -eq 0 ]; then
            exit 0
          fi

          if [ $attempt -lt $max_attempts ] && {
            [[ "$deploy_output" == *"Unable to stream download"* ]] ||
            [[ "$deploy_output" == *"'NoneType' object has no attribute 'json'"* ]];
          }; then
            echo "Azure CLI returned a transient deployment-response failure. Retrying in ${retry_delay_seconds}s..."
            sleep "$retry_delay_seconds"
            attempt=$((attempt + 1))
            retry_delay_seconds=$((retry_delay_seconds * 2))
            continue
          fi

          exit $deploy_exit_code
        done
