<meta charset="UTF-8"/>

<title>Aonik · Admin UI</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: var(--font-sans); }
  /* Scope: every artboard gives its AppShell a 100% height & local background */
  .aonik-frame {
    width: 100%; height: 100%;
    background: var(--background);
    overflow: hidden;
    border-radius: 6px;
  }
  /* Thinner scrollbars inside artboards */
  .aonik-frame *::-webkit-scrollbar { width: 8px; height: 8px; }
  .aonik-frame *::-webkit-scrollbar-thumb { background: rgba(0,0,0,.14); border-radius: 999px; }
  .aonik-frame *::-webkit-scrollbar-track { background: transparent; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  [data-theme="dark"] {
    --background: #1a1d21;
    --surface: #21252a;
    --surface-inset: #1d2024;
    --border-light: #2d3239;
    --border-medium: #3a4049;
    --text-primary: #e8eaec;
    --text-secondary: #9ba3ad;
    --text-tertiary: #6e7680;
    --brand-primary-10: #055a6030;
    --gray-200: #2d3239;
    --gray-400: #5a6069;
    --gray-500: #8a9099;
  }
</style>
</head>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "density": "compact",
  "accent": "teal",
  "sidebarCollapsed": false,
  "showAgentRail": false,
  "proposalStyle": "coral-rail",
  "agentAvatars": true
}/*EDITMODE-END*/;

const ACCENTS = {
  teal:   { primary: '#055a60', p60: '#055a6099', p10: '#055a6018' },
  indigo: { primary: '#3f41a0', p60: '#3f41a099', p10: '#3f41a018' },
  jade:   { primary: '#1f7a5e', p60: '#1f7a5e99', p10: '#1f7a5e18' },
  ink:    { primary: '#1e2228', p60: '#1e222899', p10: '#1e222818' },
};

function ArtboardFrame({ children }) {
  return <div className="aonik-frame">{children}</div>;
}

// Shared right-rail content used on relevant screens (Invoices, My Space, Journal).

              { label: 'Confidence', value: '0.94' },

    ),
    myspace: (
      <AgentRail
        messages={[

            <div style={{ padding: '10px 12px', background: 'var(--surface-inset)', borderRadius: '12px 12px 12px 4px', fontSize: 12.5, color: 'var(--text-primary)', lineHeight: 1.5, maxWidth: 300 }}>
              You asked about where April spend is going. Here's the breakdown:
            </div>
          </div>,
        ]}
        proposals={[]}
      >
        <div style={{ paddingLeft: 34, marginTop: 4, display: 'flex', flexDirection: 'column', gap: 10 }}>
          <ToolCardPie
            title="Spending · April 2026"
            totalSpent={42180}
            currency="GBP"
            categories={[

              { name: 'Warehousing',   amount: 10100, percentage: 24 },
              { name: 'Contractors',   amount:  8420, percentage: 20 },
              { name: 'Insurance',     amount:  3960, percentage:  9 },
              { name: 'Other',         amount:   500, percentage:  1 },

            action="Schedule fuel alert at £18K"
            description="Notify Maria when fuel category reaches 95% of next month's budget."
            severity="low"

    customer: (

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [openJob, setOpenJob] = React.useState(null);

  // Apply theme + accent at document level so tokens cascade.
  React.useEffect(() => {
    const html = document.documentElement;
    html.dataset.theme = t.theme;
    const a = ACCENTS[t.accent] || ACCENTS.teal;
    html.style.setProperty('--brand-primary', a.primary);
    html.style.setProperty('--brand-primary-60', a.p60);
    html.style.setProperty('--brand-primary-10', a.p10);

    // Density → row-height CSS var
    const densities = { compact: 36, regular: 44, comfy: 52 };
    html.style.setProperty('--row-height', (densities[t.density] || 44) + 'px');
  }, [t.theme, t.accent, t.density]);

  // Artboard sizes (16:10-ish for desktop product shots)
  const W = 1480, H = 980;

  const mkShell = (active, breadcrumbs, ScreenComponent, railVariant = null, opts = {}) => (
    <ArtboardFrame>
      <AonikShell
        active={active}
        breadcrumbs={breadcrumbs}
        sidebarCollapsed={t.sidebarCollapsed}
        topActions={opts.topActions}
        showUpgrade={opts.showUpgrade}
        profileMenuOpen={opts.profileMenuOpen}
        rightRail={railVariant && t.showAgentRail ? <DefaultAgentRail variant={railVariant}/> : null}
      >
        <ScreenComponent/>
      </AonikShell>
    </ArtboardFrame>
  );

    <>
      <DesignCanvas title="Aonik · Admin UI" subtitle="Agents propose. Systems apply.">

        <DCSection id="core" title="Core workspaces" subtitle="The three surfaces every operator lives in">

            <ArtboardFrame><ScreenLogin/></ArtboardFrame>
          </DCArtboard>
          <DCArtboard id="myspace"  label="My Space · greeting + agent proposals" width={W} height={H}>
            {mkShell('myspace',  ['My Space'], ScreenMySpace, 'myspace', { showUpgrade: true, topActions: <UpgradePill/> })}
          </DCArtboard>
          <DCArtboard id="agents"   label="Agent Command Center · roster + live trace" width={W} height={H}>
            {mkShell('agents',   ['Admin', 'Agents'], ScreenAgents)}
          </DCArtboard>
          <DCArtboard id="agents-page" label="Agents · profile cards + slide-out edit panel" width={W} height={H}>
            {mkShell('agents', ['AI', 'Agents'], ScreenAgentsPage)}
          </DCArtboard>
          <DCArtboard id="agent-detail" label="Agent detail · Billing Agent · sub-agents, tools, skills, MCP servers + edit slide-out" width={W} height={H}>
            {mkShell('agents', ['AI', 'Agents', 'Billing Agent'], ScreenAgentDetail)}
          </DCArtboard>
          <DCArtboard id="workflows" label="Agent Workflows · reusable procedures · step rails + detail pane" width={W} height={H}>
            {mkShell('workflows', ['AI', 'Workflows'], ScreenWorkflows)}
          </DCArtboard>
          <DCArtboard id="workflow-editor" label="Workflow editor · canvas + palette + inspector + live test" width={1720} height={1080}>
            <ArtboardFrame><ScreenWorkflowEditor/></ArtboardFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="ia" title="New IA · Transact / Products / Platform" subtitle="Orders is universal · Bill Payments and Remittances are catalog + config">
          <DCArtboard id="approvals" label="Approvals · cross-product decision queue · 3-pane" width={W} height={H}>
            {mkShell('approvals', ['Transact', 'Approvals'], ScreenApprovals)}
          </DCArtboard>
          <DCArtboard id="billers" label="Bill Payments · Billers catalog · category rail + cards" width={W} height={H}>
            {mkShell('billers', ['Products', 'Bill Payments', 'Billers'], ScreenBillers)}
          </DCArtboard>
          <DCArtboard id="corridors" label="Remittances · Corridors · ranked partners + live rate" width={W} height={H}>
            {mkShell('corridors', ['Products', 'Remittances', 'Corridors'], ScreenCorridors)}

        <DCSection id="observability" title="Observability" subtitle="System health · traces · logs · audit">

          </DCArtboard>
        </DCSection>

        <DCSection id="onboarding" title="Tenant onboarding · 3 directions" subtitle="Same content domain · same brand · different form-factor — A · split / B · single-page / C · conversational">
          <DCArtboard id="onboarding-split" label="A · Editorial split-screen · brand wall + 5-step form (showing Features step)" width={W} height={H}>
            <ArtboardFrame><ScreenTenantSignupSplit/></ArtboardFrame>
          </DCArtboard>
          <DCArtboard id="onboarding-single" label="B · Single-page anchored scroll · all sections at once · TOC rail" width={W} height={H}>
            <ArtboardFrame><ScreenTenantSignupSinglePage/></ArtboardFrame>
          </DCArtboard>
          <DCArtboard id="onboarding-chat" label="C · Conversational · agent-led chat reveals form chunks inline" width={W} height={H}>
            <ArtboardFrame><ScreenTenantSignupChat/></ArtboardFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="platform" title="Platform · Background workers" subtitle="Scheduled jobs, run history, drawer with success/error detail">
          <DCArtboard id="workers" label="Background workers · table + sparklines + run drawer" width={W} height={H}>
            <ArtboardFrame>
              <AonikShell
                active="settings"
                breadcrumbs={['Settings', 'Background workers']}
                sidebarCollapsed={t.sidebarCollapsed}
              >
                <WorkersScreen onOpen={setOpenJob} onAction={() => {}}/>
              </AonikShell>
            </ArtboardFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="account" title="Account" subtitle="Workspace plan, usage, billing, profile, and security · reached from the bottom-left profile menu">
          <DCArtboard id="account-plan" label="Account · Plan · Launch / Growth / Scale tiers · cards only" width={W} height={H}>
            {mkShell('myspace', ['Account', 'Plan'], ScreenAccountPlan, null, { showUpgrade: true, topActions: <UpgradePill/> })}
          </DCArtboard>
          <DCArtboard id="account-usage" label="Account · Usage · current plan + tenant-wide quotas" width={W} height={H}>
            {mkShell('myspace', ['Account', 'Usage'], ScreenAccountUsage, null, { showUpgrade: true, topActions: <UpgradePill/> })}
          </DCArtboard>
          <DCArtboard id="account-billing" label="Account · Billing · current plan + payment method + recent invoices" width={W} height={H}>
            {mkShell('myspace', ['Account', 'Billing'], ScreenAccountBilling, null, { showUpgrade: true, topActions: <UpgradePill/> })}
          </DCArtboard>
          <DCArtboard id="account-profile" label="Account · Profile · identity + locale + theme" width={W} height={H}>
            {mkShell('myspace', ['Account', 'Profile'], ScreenAccountProfile)}
          </DCArtboard>
          <DCArtboard id="account-security" label="Account · Security · password + 2FA + sessions" width={W} height={H}>
            {mkShell('myspace', ['Account', 'Security'], ScreenAccountSecurity)}
          </DCArtboard>
        </DCSection>

        <DCSection id="speech" title="Speech & Voice" subtitle="Providers · Recipes · Voice Mode · Chat Speech — guided configuration for spoken AI">
          <DCArtboard id="speech-providers" label="Speech & Voice · Providers · STT / TTS / Realtime · cards + filters" width={W} height={H}>
            {mkShell('settings', ['Settings', 'AI', 'Speech & Voice', 'Providers'], ScreenSpeechProviders)}
          </DCArtboard>
          <DCArtboard id="speech-recipes" label="Speech & Voice · Recipes · chained vs realtime · visual flow" width={W} height={H}>
            {mkShell('settings', ['Settings', 'AI', 'Speech & Voice', 'Recipes'], ScreenSpeechRecipes)}
          </DCArtboard>
          <DCArtboard id="speech-voicemode" label="Speech & Voice · Voice Mode · live spoken conversations" width={W} height={H}>
            {mkShell('settings', ['Settings', 'AI', 'Speech & Voice', 'Voice Mode'], ScreenSpeechVoiceMode)}
          </DCArtboard>
          <DCArtboard id="speech-chatspeech" label="Speech & Voice · Chat Speech · spoken playback for written replies" width={W} height={H}>
            {mkShell('settings', ['Settings', 'AI', 'Speech & Voice', 'Chat Speech'], ScreenSpeechChatSpeech)}
          </DCArtboard>
        </DCSection>

        <DCSection id="ops" title="Operations & Admin" subtitle="Compliance, users, tenants">
          <DCArtboard id="compliance" label="Compliance · KYC/KYB documents" width={W} height={H}>
            {mkShell('compliance', ['Operations', 'Compliance'], ScreenCompliance)}
          </DCArtboard>
          <DCArtboard id="users" label="Users · roles + MFA" width={W} height={H}>
            {mkShell('users', ['Finance', 'Access', 'Users'], ScreenUsers)}
          </DCArtboard>
          <DCArtboard id="tenants" label="Tenants · host admin · provisioning" width={W} height={H}>
            {mkShell('tenants', ['Admin', 'Tenants'], ScreenTenants)}
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      <RunDrawer job={openJob} onClose={() => setOpenJob(null)} onAction={() => {}} agentLayer={true}/>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme"/>
        <TweakRadio label="Mode" value={t.theme} options={['light', 'dark']} onChange={v => setTweak('theme', v)}/>
        <TweakRadio label="Accent" value={t.accent} options={['teal', 'indigo', 'jade', 'ink']} onChange={v => setTweak('accent', v)}/>

        <TweakSection label="Layout"/>
        <TweakRadio label="Density" value={t.density} options={['compact', 'regular', 'comfy']} onChange={v => setTweak('density', v)}/>
        <TweakToggle label="Collapse sidebar" value={t.sidebarCollapsed} onChange={v => setTweak('sidebarCollapsed', v)}/>
        <TweakToggle label="Show agent rail" value={t.showAgentRail} onChange={v => setTweak('showAgentRail', v)}/>

        <TweakSection label="Agent surfaces"/>
        <TweakRadio label="Proposal style" value={t.proposalStyle}
                    options={['coral-rail', 'flat', 'tinted']}
                    onChange={v => setTweak('proposalStyle', v)}/>
        <TweakToggle label="Show agent avatars" value={t.agentAvatars} onChange={v => setTweak('agentAvatars', v)}/>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
