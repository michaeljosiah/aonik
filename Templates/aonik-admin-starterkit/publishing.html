<script type="text/babel">function PublishingStudio(){const p=new URLSearchParams(location.search),capture=p.get('capture')==='1';const[theme,setTheme]=React.useState(p.get('theme')==='dark'?'dark':'light');React.useEffect(()=>{document.documentElement.dataset.theme=theme;},[theme]);React.useEffect(()=>{if(capture||!p.has('scene'))return;const timer=setTimeout(()=>document.querySelector('[data-dc-slot="publishing-'+p.get('scene')+'"] .dc-labeltext')?.click(),100);return()=>clearTimeout(timer);},[]);return capture?<ScreenArkePublishing scene={p.get('scene')||'queue'}/>:<><nav className="publishing-tools"><a href="index.html">Full canvas</a><a href="marketing/publishing.html">Design review</a><button onClick={()=>setTheme(theme==='light'?'dark':'light')}>Switch theme</button></nav><DesignCanvas title="Arke · Editorial & publication" subtitle="Editable artboards · Shared application views and icons · Fictional data"><DCSection id="publishing" title="Publishing" subtitle="Review exact private editions, approve independently and release with recoverable delivery.">{arkePublishingArtboards()}</DCSection></DesignCanvas></>;}ReactDOM.createRoot(document.getElementById('root')).render(<PublishingStudio/>);</script></body></html>
