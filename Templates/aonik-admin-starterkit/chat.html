<script type="text/babel">
function ChatStudio(){const params=new URLSearchParams(location.search);const capture=params.get('capture')==='1';const scene=CHAT_DESIGN_SCENES.some(([id])=>id===params.get('scene'))?params.get('scene'):'slideout';const [theme,setTheme]=React.useState(new URLSearchParams(location.search).get('theme')==='dark'?'dark':'light');React.useEffect(()=>{document.documentElement.dataset.theme=theme;},[theme]);if(capture)return <ScreenChatDesign scene={scene}/>;return <><nav className="remit-studio-tools"><a className="btn btn-outline" href="index.html">Full design canvas</a><a className="btn btn-outline" href="marketing/index.html">Screenshots</a><button className="btn btn-primary" onClick={()=>setTheme(theme==='light'?'dark':'light')}>Switch theme</button></nav><DesignCanvas title="Chat · People & agents" subtitle="Editable design prototypes · Fictional local interactions · Source: screens/ai-chat.jsx"><DCSection id="chat-designs" title="Chat surfaces" subtitle="Slide-out responses, scoped permissions, shared human/agent conversations, proposal review, message notifications and mentions. Click a label to focus an artboard.">{chatArtboards()}</DCSection></DesignCanvas></>;}ReactDOM.createRoot(document.getElementById('root')).render(<ChatStudio/>);
</script></body></html>
