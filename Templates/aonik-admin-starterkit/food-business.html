function FoodStudio(){const params=new URLSearchParams(location.search);const capture=params.get('capture')==='1';const scene=FOOD_SCENES.some(item=>item.id===params.get('scene'))?params.get('scene'):'today';const [theme,setTheme]=React.useState(new URLSearchParams(location.search).get('theme')==='dark'?'dark':'light');React.useEffect(()=>{document.documentElement.dataset.theme=theme;},[theme]);React.useEffect(()=>{if(capture||!params.has('scene'))return;const target=FOOD_SCENES.find(item=>item.id===scene);const timer=setTimeout(()=>document.querySelector('[data-dc-slot=\"'+target.legacy+'\"] .dc-labeltext')?.click(),100);return()=>clearTimeout(timer);},[]);if(capture)return <ScreenFoodBusiness scene={scene}/>;return <><nav className="remit-studio-tools"><a className="btn btn-outline" href="index.html">Full design canvas</a><a className="btn btn-outline" href="marketing/index.html">Screenshots</a><button className="btn btn-primary" onClick={()=>setTheme(theme==='light'?'dark':'light')}>Switch theme</button></nav><DesignCanvas title="Food business · Less noise, clearer work" subtitle="Editable design prototypes · Fictional local interactions · Source: screens/food-business.jsx"><DCSection id="food-day" title="Business & customers" subtitle="Overview, customers, orders, invoices and payments in one workspace.">{foodArtboards(1600,1100,['today','customers','orders','finance'])}</DCSection><DCSection id="food-kitchen" title="Kitchen & stock" subtitle="Plan, make, buy and receive.">{foodArtboards(1600,1100,['kitchen','stock'])}</DCSection><DCSection id="food-shop" title="Shop & reports" subtitle="Menu, food labels, prices, delivery and margin.">{foodArtboards(1600,1100,['shop','reports'])}</DCSection></DesignCanvas></>;}ReactDOM.createRoot(document.getElementById('root')).render(<FoodStudio/>);
</script></body></html>
