<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Colors — Warm Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--pay-surface-warm-elevated);}
  .grid { display:grid; grid-template-columns: repeat(5,1fr); gap:10px; }
  .sw { border:1px solid var(--pay-border-strong); border-radius: var(--pay-r-sm); overflow:hidden; background:white; }
  .chip { height:56px; }
  .meta { padding: 6px 8px; }
  .n { font: 700 10px/14px var(--pay-font); text-transform: uppercase; letter-spacing: 0.1px; color: var(--pay-text-primary);}
  .h { font: 400 10px/14px var(--pay-font); color: var(--pay-text-muted);}
  .caption { font: 600 11px/14px var(--pay-font); color: var(--pay-text-subtle-warm); margin: 0 0 10px; letter-spacing:0.2px; }
</style>
</head>
<body>
  <div class="caption">WARM · the brand's signature palette (cream → sand → clay → coffee)</div>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#FFFCF9"></div><div class="meta"><div class="n">Warm 050</div><div class="h">#FFFCF9</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFBF7"></div><div class="meta"><div class="n">Warm 100</div><div class="h">#FFFBF7</div></div></div>
    <div class="sw"><div class="chip" style="background:#F7EEE4"></div><div class="meta"><div class="n">Warm 150</div><div class="h">#F7EEE4</div></div></div>
    <div class="sw"><div class="chip" style="background:#F4ECDE"></div><div class="meta"><div class="n">Warm 200</div><div class="h">#F4ECDE</div></div></div>
    <div class="sw"><div class="chip" style="background:#DCCDB7"></div><div class="meta"><div class="n">Warm 300</div><div class="h">#DCCDB7</div></div></div>
    <div class="sw"><div class="chip" style="background:#D7A14E"></div><div class="meta"><div class="n">Warm 500</div><div class="h">#D7A14E</div></div></div>
    <div class="sw"><div class="chip" style="background:#9B7A43"></div><div class="meta"><div class="n">Warm 600</div><div class="h">#9B7A43</div></div></div>
    <div class="sw"><div class="chip" style="background:#77594A"></div><div class="meta"><div class="n">Warm 800</div><div class="h">#77594A</div></div></div>
    <div class="sw"><div class="chip" style="background:#4D3120"></div><div class="meta"><div class="n">Warm 900</div><div class="h">#4D3120</div></div></div>
    <div class="sw"><div class="chip" style="background:#F0E7DA"></div><div class="meta"><div class="n">Nav border</div><div class="h">#F0E7DA</div></div></div>
  </div>
</body>
</html>
