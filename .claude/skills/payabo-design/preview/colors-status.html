<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Colors — Status</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--pay-surface-warm-elevated);}
  .row { display:flex; gap:10px;}
  .sw { flex:1; border:1px solid var(--pay-border-strong); border-radius: var(--pay-r-sm); overflow:hidden; background:white;}
  .chip { height: 68px; display:flex; align-items:center; justify-content:center;}
  .chip .pill { background: white; color: var(--pay-text-primary); padding: 4px 10px; border-radius: var(--pay-r-pill); font: 600 11px/14px var(--pay-font);}
  .meta { padding: 8px 10px;}
  .n { font:700 11px/14px var(--pay-font); text-transform:uppercase; letter-spacing:0.1px; color:var(--pay-text-primary);}
  .h { font:400 11px/14px var(--pay-font); color: var(--pay-text-muted);}
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:#4ACB64"><span class="pill" style="background:#ECFAEF;color:#1B7030;border:1px solid #4ACB64">Completed</span></div>
      <div class="meta"><div class="n">Success</div><div class="h">#4ACB64 · soft #ECFAEF</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#FF9E15"><span class="pill" style="color:#8A5100">Processing</span></div>
      <div class="meta"><div class="n">Warning</div><div class="h">#FF9E15</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#E60037"><span class="pill" style="color:#8A0022">Failed</span></div>
      <div class="meta"><div class="n">Danger</div><div class="h">#E60037</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#2465E8"><span class="pill" style="color:#123a8f">Info</span></div>
      <div class="meta"><div class="n">Info</div><div class="h">#2465E8</div></div>
    </div>
  </div>
</body>
</html>
