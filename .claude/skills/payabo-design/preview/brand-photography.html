<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Photography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--pay-surface-warm-elevated); font: var(--pay-font);}
  .row { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px;}
  .ph { aspect-ratio: 3/4; background-size: cover; background-position: center; border-radius: var(--pay-r-sm); border: 1px solid var(--pay-border-strong);}
  .caption { font: 600 10px/14px var(--pay-font); color: var(--pay-text-subtle-warm); margin: 8px 0 0; letter-spacing:0.1px; text-transform:uppercase;}
  h4 { font: 700 13px/16px var(--pay-font); color: var(--pay-text-subtle-warm); margin: 0 0 10px;}
</style>
</head>
<body>
  <h4>Warm, real photography · African subjects · intimate interiors</h4>
  <div class="row">
    <div><div class="ph" style="background-image:url('../assets/setup-hero.png')"></div><div class="caption">Setup hero</div></div>
    <div><div class="ph" style="background-image:url('../assets/simi.png'); background-position:50% 20%"></div><div class="caption">Simi (AI)</div></div>
    <div><div class="ph" style="background-image:url('../assets/spending-empty-hero.png'); background-color:#0F0D0E"></div><div class="caption">3D render · empty state</div></div>
  </div>
</body>
</html>
