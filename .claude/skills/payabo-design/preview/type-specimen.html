<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Type specimen — Open Sans</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--pay-surface-warm-elevated); color: var(--pay-text-primary);}
  .huge { font: 800 92px/92px var(--pay-font); letter-spacing:-3px; color: var(--pay-warm-900);}
  .row { display:flex; gap:16px; margin-top: 12px; align-items:flex-end;}
  .weight { flex:1; font: 400 16px/18px var(--pay-font); color: var(--pay-warm-900);}
  .w300 { font-weight: 300;} .w400 { font-weight: 400;} .w500 { font-weight: 500;}
  .w600 { font-weight: 600;} .w700 { font-weight: 700;} .w800 { font-weight: 800;}
  .tag { display:block; font: 600 10px/12px var(--pay-font); color: var(--pay-text-muted); letter-spacing:0.2px; text-transform:uppercase; margin-top: 4px;}
</style>
</head>
<body>
  <div class="huge">Payabo · Aa</div>
  <div class="row">
    <div class="weight w300">Aa<span class="tag">300 Light</span></div>
    <div class="weight w400">Aa<span class="tag">400 Regular</span></div>
    <div class="weight w500">Aa<span class="tag">500 Medium</span></div>
    <div class="weight w600">Aa<span class="tag">600 Semibold</span></div>
    <div class="weight w700">Aa<span class="tag">700 Bold</span></div>
    <div class="weight w800">Aa<span class="tag">800 Extrabold</span></div>
  </div>
</body>
</html>
