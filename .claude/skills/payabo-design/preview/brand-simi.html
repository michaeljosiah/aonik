<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Simi portrait — brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--pay-grad-chat-hero); color: white; font: var(--pay-font); display:flex; align-items:center; gap:20px;}
  .photo { width: 160px; height: 160px; border-radius: 50%; overflow: hidden; flex:none; background-image:url('../assets/simi.png'); background-size: cover; background-position: 50% 20%; box-shadow: 0 0 0 2px rgba(243,121,32,0.4), 0 0 40px rgba(243,121,32,0.3);}
  h1 { font: 700 24px/30px var(--pay-font); margin: 0 0 6px;}
  p { font: 400 14px/20px var(--pay-font); color: rgba(255,255,255,0.8); margin:0;}
  .tag { font: 700 10px/14px var(--pay-font); letter-spacing:1.4px; text-transform:uppercase; color: var(--pay-orange-500); margin-bottom: 6px;}
</style>
</head>
<body>
  <div class="photo"></div>
  <div>
    <div class="tag">AI Companion</div>
    <h1>Simi</h1>
    <p>"Here's your spending overview. I'll keep an eye on your accounts and flag anything unusual."</p>
  </div>
</body>
</html>
