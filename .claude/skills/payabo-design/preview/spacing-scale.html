<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--pay-surface-warm-elevated); }
  .row { display:flex; align-items:center; gap:16px; padding:6px 0; border-bottom:1px solid var(--pay-border-default);}
  .row:last-child { border:0;}
  .name { width: 60px; flex:none; font: 700 11px/14px var(--pay-font); text-transform: uppercase; letter-spacing: 0.1px; color: var(--pay-text-primary);}
  .val { width: 48px; flex:none; font: 400 11px/14px var(--pay-font); color: var(--pay-text-muted);}
  .bar { height: 14px; background: var(--pay-orange-500); border-radius: 2px;}
</style>
</head>
<body>
  <div class="row"><div class="name">xxs</div><div class="val">2</div><div class="bar" style="width:2px"></div></div>
  <div class="row"><div class="name">xs</div><div class="val">4</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="name">sm</div><div class="val">8</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="name">md</div><div class="val">12</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="name">lg</div><div class="val">16</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="name">xl</div><div class="val">20</div><div class="bar" style="width:20px"></div></div>
  <div class="row"><div class="name">x2</div><div class="val">24</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="name">x3</div><div class="val">30</div><div class="bar" style="width:30px"></div></div>
  <div class="row"><div class="name">x4</div><div class="val">40</div><div class="bar" style="width:40px"></div></div>
</body>
</html>
