<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bottom nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 0 0; background: var(--pay-surface-warm); font: var(--pay-font);}
  .nav { position: relative; background: white; border-top: 1px solid var(--pay-nav-border); height: 74px; display:flex; align-items:center; justify-content:space-around; box-shadow: var(--pay-shadow-nav); margin: 0 0 0 0;}
  .item { display:flex; flex-direction:column; align-items:center; gap: 4px; color: var(--pay-nav-unselected); font: 400 12px/14px var(--pay-font); width: 60px;}
  .item.on { color: var(--pay-nav-selected);}
  .ico { width: 22px; height: 22px; display:flex; align-items:center; justify-content:center;}
  .ico svg { stroke: currentColor; fill:none; stroke-width:2;}
  .gap { width: 72px;}
  .fab { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 58px; height: 58px; border-radius: 50%; background: var(--pay-orange-500); color: white; display:flex; align-items:center; justify-content:center; box-shadow: var(--pay-shadow-fab); border: 4px solid white;}
  .fab svg { width:22px; height:22px; stroke: white; fill:none; stroke-width:2.5;}
</style>
</head>
<body>
  <div class="nav">
    <div class="item on"><div class="ico"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a2 2 0 01-2 2h-4v-7H9v7H5a2 2 0 01-2-2V11z"/></svg></div>Home</div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8l4 4-4 4"/></svg></div>Pay</div>
    <div class="gap"></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 7V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v3"/></svg></div>Spending</div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 11-3-6.2L21 3v5h-5"/></svg></div>Chat</div>
    <div class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
  </div>
</body>
</html>
