<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--pay-surface-warm-elevated); font: var(--pay-font);}
  .row { display:grid; grid-template-columns: repeat(8, 1fr); gap: 12px;}
  .c { display:flex; flex-direction:column; align-items:center; gap: 6px; padding: 10px; border: 1px solid var(--pay-border-default); border-radius: var(--pay-r-sm); background: white;}
  .c svg { width: 22px; height: 22px; stroke: var(--pay-warm-900); fill:none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;}
  .lbl { font: 600 9px/12px var(--pay-font); color: var(--pay-text-muted); letter-spacing:0.1px; text-transform:uppercase; text-align:center;}
  h4 { font: 700 12px/16px var(--pay-font); color: var(--pay-text-subtle-warm); margin: 0 0 10px;}
  .sub { font: 400 11px/16px var(--pay-font); color: var(--pay-text-muted); margin-bottom: 10px;}
</style>
</head>
<body>
  <h4>Material Icons (rounded) in app · Lucide substitute on web</h4>
  <div class="sub">Stroke 2px, size 18/21/22/40. No emoji. Flags are SVG.</div>
  <div class="row">
    <div class="c"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a2 2 0 01-2 2h-4v-7H9v7H5a2 2 0 01-2-2V11z"/></svg><span class="lbl">Home</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8l4 4-4 4"/></svg><span class="lbl">Pay</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 7V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v3"/></svg><span class="lbl">Spending</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span class="lbl">Chat</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 7 3 7 3 9H3c0-2 3-2 3-9zM10 19a2 2 0 104 0"/></svg><span class="lbl">Bell</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="10"/></svg><span class="lbl">Account</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span class="lbl">Back</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg><span class="lbl">Close</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Add</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg><span class="lbl">Chevron</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg><span class="lbl">Send</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span class="lbl">Card</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M3 10l2-6h14l2 6M3 10v10h18V10M3 10h18"/></svg><span class="lbl">Bill</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M21 13.5l-9 7.5-9-7.5M12 3v18"/></svg><span class="lbl">Transfer</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zM12 6v6l4 2"/></svg><span class="lbl">Recent</span></div>
    <div class="c"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span class="lbl">Settings</span></div>
  </div>
</body>
</html>
