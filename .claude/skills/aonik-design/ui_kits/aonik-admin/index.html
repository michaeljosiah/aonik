<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AONIK Admin UI — Kit</title>
<link rel="stylesheet" href="../../tokens.css"/>
<style>
  html, body { margin: 0; height: 100%; }
  html { background: var(--background); transition: background 180ms ease; }
  body { font-family: var(--font-sans); color: var(--text-primary); background: var(--background); }

  /* Theme toggle — floating pill, fixed top-right */
  .theme-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 50;
    display: inline-flex; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px;
    box-shadow: var(--shadow-sm);
    font-family: var(--font-sans);
  }
  .theme-toggle button {
    border: none; background: transparent; cursor: pointer;
    padding: 6px 12px; font-size: 12px; font-weight: 500;
    color: var(--text-secondary); border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 150ms ease, color 150ms ease;
    font-family: inherit;
  }
  .theme-toggle button:hover { color: var(--text-primary); }
  .theme-toggle button[aria-pressed="true"] {
    background: var(--brand-primary);
    color: #fff;
  }
  .theme-toggle svg { width: 14px; height: 14px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
  // Apply persisted theme before React hydrates to avoid a flash
  (function() {
    try {
      var t = localStorage.getItem('aonik-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="ledger.jsx"></script>
<script type="text/babel" src="agent-center.jsx"></script>
<script type="text/babel" data-presets="react">
// ─── Theme toggle ─────────────────────────────────────────────────────────
function ThemeToggle() {
  const [theme, setTheme] = React.useState(
    () => document.documentElement.getAttribute('data-theme') || 'light'
  );
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('aonik-theme', theme); } catch (e) {}
  }, [theme]);

  const sun = (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  );
  const moon = (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  );

  return (
    <div className="theme-toggle" role="group" aria-label="Theme">
      <button aria-pressed={theme === 'light'} onClick={() => setTheme('light')}>
        {sun} Light
      </button>
      <button aria-pressed={theme === 'dark'} onClick={() => setTheme('dark')}>
        {moon} Dark
      </button>
    </div>
  );
}

// Scaled artboard — fits BOARD_W to container width
function Artboard({ label, width, height, children }) {
  const ref = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const measure = () => {
      const w = ref.current?.parentElement?.clientWidth || window.innerWidth;
      setScale(Math.min(1, (w - 48) / width));
    };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, [width]);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 36 }}>
      <div style={{
        fontFamily: 'var(--font-mono)', fontSize: 11,
        color: 'var(--text-tertiary)', letterSpacing: '0.04em',
        padding: '0 4px',
      }}>{label}</div>
      <div ref={ref} style={{
        width: width * scale, height: height * scale,
        background: 'var(--surface)', borderRadius: 4,
        boxShadow: '0 4px 20px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.05)',
        overflow: 'hidden',
      }}>
        <div style={{
          width, height,
          transform: `scale(${scale})`, transformOrigin: 'top left',
        }}>{children}</div>
      </div>
    </div>
  );
}

function Section({ title, subtitle, children }) {
  return (
    <div style={{ marginBottom: 48 }}>
      <div style={{
        fontFamily: 'var(--font-brand)', fontSize: 20, fontWeight: 700,
        color: 'var(--text-primary)', letterSpacing: '-0.01em',
      }}>{title}</div>
      {subtitle && <div style={{
        fontSize: 13, color: 'var(--text-secondary)',
        marginTop: 4, marginBottom: 20,
      }}>{subtitle}</div>}
      {children}
    </div>
  );
}

function App() {
  // Conversation mock for the agent rail
  const conv = (
    <>
      <div style={{ display:'flex', justifyContent:'flex-end' }}>
        <div style={{
          background:'var(--brand-primary-10)', color:'var(--text-primary)',
          borderRadius:'14px 14px 4px 14px', padding:'10px 14px', fontSize:13, maxWidth:'80%',
        }}>Why is INV-2041 still open? The payment landed last week.</div>
      </div>
      <div style={{ display:'flex', gap:10 }}>
        <Avatar name="L" size={24} color="var(--brand-primary)" textColor="#fff"/>
        <div style={{ background:'var(--surface-inset)', color:'var(--text-primary)', borderRadius:'14px 14px 14px 4px', padding:'10px 14px', fontSize:13, maxWidth:'80%', lineHeight:1.55 }}>
          Found a bank transaction from 19 Nov for $12,480.00 that matches reference, amount, and counterparty. Confidence 0.94. Drafted a journal entry to post INV-2041 and match it.
        </div>
      </div>
    </>
  );

  const railProposals = [{
    agent: 'Billing',
    confidence: 0.94,
    summary: 'Apply bank_txn_9f2c1a to INV-2041 and post JE-88421',
    diff: [
      { type: 'ctx', text: 'invoice: INV-2041' },
      { type: 'rm',  text: 'status: draft' },
      { type: 'add', text: 'status: posted' },
      { type: 'add', text: 'journal_entry: JE-88421' },
      { type: 'add', text: 'matched_to: bank_txn_9f2c1a (95%)' },
    ],
    reason: 'Reference + amount ($12,480.00) + counterparty (Primrose Logistics) all match.',
  }];

  const BOARD_W = 1440, BOARD_H = 900;

  const DashboardBoard = () => (
    <div style={{ width: BOARD_W, height: BOARD_H, background: 'var(--background)' }}>
      <AppShell
        active="myspace"
        breadcrumbs={['Workspace', 'My Space']}
        topActions={<button className="btn btn-ghost btn-sm"><Icon name="sparkles" size={12} color="var(--brand-primary)"/> Ask Aonik</button>}
        rightRail={<AgentRail messages={conv} proposals={[]} thinking={true}/>}
      >
        <DashboardScreen/>
      </AppShell>
    </div>
  );

  const LedgerBoard = () => (
    <div style={{ width: BOARD_W, height: BOARD_H, background: 'var(--background)' }}>
      <AppShell
        active="invoices"
        breadcrumbs={['Finance', 'Invoices']}
        rightRail={<AgentRail messages={conv} proposals={railProposals}/>}
      >
        <LedgerScreen/>
      </AppShell>
    </div>
  );

  const AgentBoard = () => (
    <div style={{ width: BOARD_W, height: BOARD_H, background: 'var(--background)' }}>
      <AppShell
        active="agents"
        breadcrumbs={['Workspace', 'Agent Command']}
      >
        <AgentCenterScreen/>
      </AppShell>
    </div>
  );

  return (
    <>
      <ThemeToggle/>
      <div style={{
        minHeight: '100vh', padding: '32px 36px',
        background: 'var(--background)', fontFamily: 'var(--font-sans)',
        transition: 'background 180ms ease',
      }}>
        <div style={{ marginBottom: 36 }}>
          <div style={{
            fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase',
            color: 'var(--brand-primary)',
          }}>Aonik · Admin UI kit</div>
          <div style={{
            fontFamily: 'var(--font-brand)', fontSize: 28, fontWeight: 700,
            letterSpacing: '-0.01em', marginTop: 6, color: 'var(--text-primary)',
          }}>Finance + operations OS with agents inline</div>
          <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginTop: 4, maxWidth: 680 }}>
            Three representative screens built on the shared AppShell. Each artboard is 1440×900 — scaled to fit. Toggle light / dark to preview either theme; all surfaces read from CSS tokens.
          </div>
        </div>

        <Section title="Workspace" subtitle="Landing + module pages — full shell with right agent rail">
          <Artboard label="My Space · dashboard" width={BOARD_W} height={BOARD_H}>
            <DashboardBoard/>
          </Artboard>
          <Artboard label="Invoices · inline proposals" width={BOARD_W} height={BOARD_H}>
            <LedgerBoard/>
          </Artboard>
        </Section>

        <Section title="Agents" subtitle="Oversight, traces, and policies across the full agent fleet">
          <Artboard label="Agent Command Center" width={BOARD_W} height={BOARD_H}>
            <AgentBoard/>
          </Artboard>
        </Section>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
