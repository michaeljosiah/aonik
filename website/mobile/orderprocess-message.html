<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="py-4 border-bottom">
			<div class="container">
				<div class="row align-items-center">
					<div class="col">
						<a href="profile.html">
							<svg width="13" height="20" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
								<path d="M9.89968 19.7993L12.021 17.678L2.12151 7.77848L0.000185311 9.8998L9.89968 19.7993Z" fill="#F37920"/>
								<path d="M12.0203 2.12132L9.899 0L-0.000494123 9.89949L2.12083 12.0208L12.0203 2.12132Z" fill="#F37920"/>
							</svg>
						</a>
					</div>
					<div class="col-auto text-center">
						<span class="title-top">Send message to friend</span>
					</div>
					<div class="col text-end">
						<a href="#"><img src="images/icon-close.svg" alt="x"></a>
					</div>
				</div>
			</div>
		</div>
		<div class="container mb-auto mt-4">
			<p class="mb-4">Card information is processed securely through our payment partner (Stripe).</p>
			<div class="form-group mob-textarea">
				<label for="message">Message</label>
				<textarea class="form-control" id="message" rows="5" placeholder="Enter the message to send to your friend"></textarea>
			</div>
		</div>
		<div class="container">
			<div class="text-center my-4">
				<a class="text-underline" href="#">Skip message</a>
			</div>
			<div class="form-group">
				<button class="btn btn-primary btn-md w-100">SEND MESSAGE</button>
			</div>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
