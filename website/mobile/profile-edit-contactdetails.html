<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container">
			<div class="py-4 mb-2">
				<a class=" back-page d-flex justify-content-center" href="profile-personal-edit.html">
				Contact number
				</a>
			</div>
			<form class="form" action="phone-code.html" method="post">
				<div class="form_group">
					<label for="tel" class="title-label">Mobile number</label>
					<div class="row align-items-center mb-5">
						<div class="col-auto">
							<a class="flag-list flag-list-left d-flex align-items-center" href="country-phone-selection.html">
								<img src="images/flags/gb.svg" alt="UK">
								<strong>+44</strong>
							</a>
						</div>
						<div class="col">
							<input type="tel" class="form_input" placeholder="123 456 789" name="tel" id='tel' value="999 999 999">
						</div>
					</div>
					<p>We'll send you a text message with a verification code. Message and data rates may apply.</p>
				</div>
				<button type="submit" class="btn btn-primary my-3 w-100">VERIFY NEW NUMBER</button>
			</form>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
