<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container">
			<div class="py-4 mb-4 d-flex justify-content-start">
				<a href="introscreen.html">
					<svg width="13" height="20" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M9.89968 19.7993L12.021 17.678L2.12151 7.77848L0.000185311 9.8998L9.89968 19.7993Z" fill="#F37920"/>
						<path d="M12.0203 2.12132L9.899 0L-0.000494123 9.89949L2.12083 12.0208L12.0203 2.12132Z" fill="#F37920"/>
					</svg>
				</a>
			</div>
			<h2 class="mb-4 pb-2">Login details</h2>
			<form class="form form-complete" action="#" method="post">
				<div class="form_group">
					<input type="email" class="form_field" placeholder="Email" name="Email" id='email' required>
				    <label for="email" class="form_label">Email</label>
				</div>
				<div class="form_group">
					<input type="password" class="form_field icon_field" placeholder="Password" name="Password" id='password' required>
					<span toggle="#password" class="toggle-password icon-eye"></span>
						
				    <label for="password" class="form_label">Password</label>
				</div>
				<h6 class="pt-2 mb-2">Your password must contain at least:</h6>
				<ul class="bullet disabled">
					<li>8 characters</li>
					<li>1 lowercase letter</li>
					<li>1 uppercase letter</li>
					<li>1 number</li>
				</ul>
				<button type="submit" class="btn btn-primary disabled my-3 w-100">REGISTER ACCOUNT</button>
			</form>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
