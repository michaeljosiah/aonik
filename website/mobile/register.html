<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container mb-auto">
			<div class="py-4 mb-4 d-flex justify-content-end">
				<a href="introscreen.html"><img src="images/icon-close.svg" alt="x"></a>
			</div>
			<h2 class="mb-4 pb-2">Register now, it's free!</h2>
			<form class="form" action="personal-details.html" method="post">
				<div class="form_group">
					<h4  class="title-label">Registration country</h4>
					<a class="flag-list arrow py-2 d-flex align-items-center" href="country-selection.html">
						<img src="images/flags/gb.svg" alt="UK">
						United Kingdom
					</a>
				</div>
				<button type="submit" class="btn btn-primary my-3 w-100">NEXT</button>
			</form>
		</div>
		<div class="container">
			<p class="text-center my-3">By registering you agree with our <br/> 
			<a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy.</a></p>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
