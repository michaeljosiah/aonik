<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="py-4 border-bottom">
			<div class="container">
				<div class="row align-items-center">
					<div class="col">
						<a href="profile.html">
							<svg width="13" height="20" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
								<path d="M9.89968 19.7993L12.021 17.678L2.12151 7.77848L0.000185311 9.8998L9.89968 19.7993Z" fill="#F37920"/>
								<path d="M12.0203 2.12132L9.899 0L-0.000494123 9.89949L2.12083 12.0208L12.0203 2.12132Z" fill="#F37920"/>
							</svg>
						</a>
					</div>
					<div class="col-auto text-center">
						<span class="title-top">Service details</span>
					</div>
					<div class="col text-end">
						<a href="#"><img src="images/icon-close.svg" alt="x"></a>
					</div>
				</div>
			</div>
		</div>
		<div class="container mb-auto">
			<div class="form-group mt-3">
				<label for="f-label1">Service type</label>
				<input type="text" class="form-control" id="f-label1" placeholder="Montage Cable TV" disabled>
			</div>
			<div class="form-group">
				<label for="f-label2">Smart Card ID</label>
				<input type="text" class="form-control" id="f-label2" placeholder="Enter the Smart Card ID number">
			</div>
			<div class="form-group">
				<label for="f-label3">Email or mobile number</label>
				<input type="text" class="form-control" id="f-label3" placeholder="Enter email or mobile number">
			</div>
			<div class="form-group">
				<label for="f-label4">Amount</label>
				<input type="text" class="form-control" id="f-label4" placeholder="Enter amount in">
			</div>
			<div class="form-group py-2">
				<div class="d-flex align-items-center justify-content-between form-check form-switch form-switch-lg ps-0">
					<label class="form-check-label pe-switch" for="customSwitch">Recurring bill? <br/> <span>(not available for Request help with payment)</span></label>
					<input type="checkbox" class="form-check-input" id="customSwitch">
				</div>
			</div>
			<div class="form-group">
				<label for="f-label5">Frequency</label>
				<select id="f-label5" class="form-control select-box" data-placeholder="Select the frequency">
					<option></option>
					<option value="Select the frequency 01">Select the frequency 01</option>
					<option value="Select the frequency 02">Select the frequency 02</option>
				</select>
			</div>
			<div class="form-group">
				<label for="f-label6">Starts</label>
				<input type="date" class="form-control" id="f-label6" placeholder="Enter date">
			</div>
			<div class="form-group">
				<label for="f-label7">Ends</label>
				<input type="date" class="form-control" id="f-label7" placeholder="Enter date">
			</div>
			<div class="form-group">
				<div class="form-check form-check-inline">
					<input type="checkbox" class="form-check-input" id="check" name="check">
					<label class="form-check-label mb-0" for="check">Check this box, if you want to use the same payment method of current bill for recurring bills. If not checked you will receive just a reminder.</label>
				</div>
			</div> 
		</div>
		<div class="container">
			<div class="form-group">
				<button class="btn btn-primary btn-md w-100">PAY NOW</button>
			</div>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
