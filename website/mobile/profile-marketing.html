<!doctype html>
<html lang="en">
<head>
	<title>MyBillAfrica</title>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="images/favicon.ico">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/select2.min.css">
	<link rel="stylesheet" href="css/slick.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="wrapper d-flex flex-column">
		<div class="container">
			<div class="py-4 mb-2">
				<a class=" back-page d-flex justify-content-center" href="#">
				Marketing
				</a>
			</div>
			<p>Choose what marketing emails you want to receive from us.</p>
			<div class="card-item py-3">
				<a class="row align-items-center" href="profile-login-email.html">
					<div class="col">
						<div class="d-flex align-items-center">
							<div class="card-content">
								<h4 class="card-title">Email for marketing</h4>
								<p class="title-sm fw-normal">johndoe@mail.com</p>
							</div>
						</div>
					</div>
					<div class="col-auto text-end">
						<img class="pe-2" src="images/icon-arrow.svg" alt="">
					</div>
				</a>
			</div>
			<div class="card-item py-3">
				<div class="form-check form-switch p-0 m-0">
					<div class="row align-items-center">
						<div class="col">
							<label class="card-title mb-1 form-check-label" for="News">News</label>
							<span class="card-dec-sm">Updates and news services</span>
						</div>
						<div class="col-auto text-end">
							<input class="form-check-input" type="checkbox" role="switch" id="News" checked>
						</div>
					</div>
				</div>
			</div>
			<div class="card-item py-3">
				<div class="form-check form-switch p-0 m-0">
					<div class="row align-items-center">
						<div class="col">
							<label class="card-title mb-1 form-check-label" for="Offers">Offers</label>
							<span class="card-dec-sm">Offers and promotional campaigns</span>
						</div>
						<div class="col-auto text-end">
							<input class="form-check-input" type="checkbox" role="switch" id="Offers" checked>
						</div>
					</div>
				</div>
			</div>
			<div class="card-item py-3">
				<div class="form-check form-switch p-0 m-0">
					<div class="row align-items-center">
						<div class="col">
							<label class="card-title mb-1 form-check-label" for="Surveys">Surveys</label>
							<span class="card-dec-sm">To help us improve our services</span>
						</div>
						<div class="col-auto text-end">
							<input class="form-check-input" type="checkbox" role="switch" id="Surveys">
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<!-- jQuery and Bootstrap Bundle (includes Popper) -->
	<script src="js/jquery-3.5.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/jquery.validate.min.js"></script>
	<script src="js/select2.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
