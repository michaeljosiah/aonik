# Spec 029 — local-dev Keycloak profile.
#
# Single-service docker-compose that brings up a dev-mode Keycloak with the
# pre-seeded `aonik` realm (see realm-export.json). Use:
#
#     docker compose -f infra/keycloak/compose.keycloak.yml up -d
#
# Then point Aonik at it. Both provider keys are required: the first binds
# AuthOptions (JWT scheme selection), the second is the settings-layer value the
# issuer/provider check compares against, and appsettings.json pins it to Auth0.
# Setting only one yields a 401 that reads like a bad token.
#
#     dotnet run --project src/Aonik.Api -- \
#         --Auth:Provider=Keycloak \
#         --Settings:Auth.Provider=Keycloak \
#         --Auth:Keycloak:Authority=http://localhost:8080/realms/aonik
#
# Use the colon form above rather than environment variables: the env spelling of
# the second key is `Settings__Auth.Provider`, and a POSIX shell rejects the dot
# as an invalid identifier. `dotnet run --project src/Aonik.AppHost` with
# AONIK_AUTH_PROVIDER=Keycloak sets everything for you and sidesteps this.
#
# DEV-ONLY. The default admin credentials (admin / admin) and the in-memory
# database make this unsuitable for any non-local use. Production Keycloak
# deployments are operator-owned — see docs/operations/keycloak-setup.md.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aonik-keycloak-dev
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # Keycloak 26+ requires explicit hostname config in dev too when
      # tokens carry an absolute issuer URL — without it the iss claim
      # ends up as the container's internal hostname which Aonik then
      # rejects because it doesn't match Auth.Keycloak.Authority.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
